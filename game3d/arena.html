<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Sorcerer-Sword 2.5D — Arena (Milestone 1 shell)</title>
<style>
  html,body{margin:0;height:100%;background:#0a0710;overflow:hidden;font-family:system-ui,sans-serif;color:#cbb9ff}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #hud{position:fixed;left:10px;top:8px;font-size:12px;line-height:1.5;z-index:5;
       background:rgba(20,12,34,.6);padding:8px 10px;border:1px solid #3a2c5a;border-radius:8px;max-width:48ch}
  #hud b{color:#9cffd6}
  #verbs{position:fixed;right:10px;bottom:10px;font-size:12px;z-index:5;
       background:rgba(20,12,34,.6);padding:8px 10px;border:1px solid #3a2c5a;border-radius:8px}
  #verbs .k{color:#9cffd6}
  #err{position:fixed;left:10px;bottom:8px;color:#ff9a9a;font-size:12px;white-space:pre-wrap;z-index:6}
  canvas{image-rendering:auto;border-radius:6px}
  /* --- GG / BlazBlue two-fighter fighting-game HUD (top of screen) --- */
  #gghud{position:fixed;left:0;right:0;top:0;z-index:7;pointer-events:none;
         padding:8px 10px 0;font-family:'Georgia',serif;color:#f3ead0}
  #gghud .row{display:flex;align-items:flex-start;gap:8px}
  #gghud .side{flex:1;min-width:0}
  #gghud .nm{font-size:13px;font-weight:bold;letter-spacing:.5px;text-shadow:0 1px 2px #000;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #gghud .side.r .nm{text-align:right}
  /* health bar: skewed GG-style bevel; fill drains toward center (left bar shrinks left, right bar shrinks right) */
  #gghud .bar{position:relative;height:16px;margin-top:3px;background:#1a1024;
              border:2px solid #5a3f86;border-radius:3px;overflow:hidden;
              box-shadow:0 0 10px rgba(150,90,240,.25) inset}
  #gghud .fill{position:absolute;top:0;bottom:0;transition:width .12s linear}
  #gghud .side.l .fill{left:0;background:linear-gradient(90deg,#7cffc8,#3df0c8)}
  #gghud .side.r .fill{right:0;background:linear-gradient(270deg,#ff6a7a,#d03a4a)}
  /* super / level meter — thin bar under each fighter */
  #gghud .meter{height:5px;margin-top:3px;background:#160e22;border:1px solid #4a356e;border-radius:2px;overflow:hidden}
  #gghud .meter .mf{height:100%;width:0;background:linear-gradient(90deg,#f0c66a,#ffe9a8)}
  #gghud .side.r .meter .mf{margin-left:auto;background:linear-gradient(270deg,#f0c66a,#ffe9a8)}
  #gghud .center{flex:0 0 auto;text-align:center;padding:0 4px}
  #gghud .fight{font-size:15px;font-weight:bold;color:#f0c66a;text-shadow:0 1px 3px #000;line-height:1.1}
  #gghud .vs{font-size:10px;color:#cbb9ff;opacity:.85;letter-spacing:2px}
  /* --- DRAGON'S-CROWN TOUCH CONTROLS (Hiro asked 3x): virtual stick (L) + verb cluster (R).
         Hidden on desktop; shown when a coarse/touch pointer is present (or ?touch=1). Routes into the
         SAME globals the keyboard uses: stick.{dx,dy,on} for move, doSlash/doHeavy+heavyRelease/doParry/doRoll. --- */
  #touch{position:fixed;inset:0;z-index:8;pointer-events:none;display:none;touch-action:none}
  #touch.on{display:block}
  #stickBase{position:fixed;left:20px;bottom:20px;width:130px;height:130px;border-radius:50%;
    pointer-events:auto;touch-action:none;
    background:radial-gradient(circle at 50% 38%,rgba(64,42,100,.55),rgba(18,11,30,.72));
    border:2px solid #6b4ea0;box-shadow:0 0 18px rgba(150,90,240,.35),inset 0 0 18px rgba(0,0,0,.55)}
  #stickNub{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;
    background:radial-gradient(circle at 50% 34%,#cbb9ff,#5a3f86);border:2px solid #e7d6ff;
    box-shadow:0 2px 8px rgba(0,0,0,.55),0 0 14px rgba(150,90,240,.5);will-change:transform}
  #btns{position:fixed;right:18px;bottom:18px;width:212px;height:212px;pointer-events:none}
  #btns .btn{position:absolute;width:76px;height:76px;border-radius:50%;border:2px solid #8a6fc0;
    font:bold 14px 'Georgia',serif;letter-spacing:.5px;color:#f3ead0;pointer-events:auto;touch-action:none;
    background:radial-gradient(circle at 50% 34%,rgba(80,54,128,.85),rgba(26,15,40,.92));
    box-shadow:0 2px 10px rgba(0,0,0,.5),0 0 14px rgba(150,90,240,.3),inset 0 0 10px rgba(0,0,0,.45);
    text-shadow:0 1px 2px #000;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
  #btns .btn.act{transform:scale(.9);filter:brightness(1.45)}
  /* diamond cluster: HEX bottom (thumb rest) · SUMMON right · DODGE left · WARD top */
  #btns .btn.hex   {right:68px;bottom:0;  border-color:#9cffd6;box-shadow:0 0 16px rgba(60,240,200,.45),inset 0 0 10px rgba(0,0,0,.45)}
  #btns .btn.summon{right:0;  bottom:68px;border-color:#e7b450;box-shadow:0 0 16px rgba(231,180,80,.4), inset 0 0 10px rgba(0,0,0,.45)}
  #btns .btn.dodge {right:136px;bottom:68px;border-color:#cbb9ff}
  #btns .btn.ward  {right:68px;bottom:136px;border-color:#5ad2ff;box-shadow:0 0 16px rgba(90,210,255,.4), inset 0 0 10px rgba(0,0,0,.45)}
</style>

<body>
<div id="hud">
  <b>THE PIT — side-on gauntlet (pit.js parity)</b><br>
  <i>Full warlock kit: HEX / SUMMON ladder / WARD / BLINK · evolutions + transformations live.</i>
</div>
<div id="verbs">
  <span class="k">WASD/←↑↓→</span> move &nbsp; <span class="k">J / click</span> SLASH(HEX)<br>
  <span class="k">Q (hold→release)</span> HEAVY(SUMMON) &nbsp; <span class="k">K</span> PARRY(PORTAL)<br>
  <span class="k">Space / R-click</span> ROLL(BLINK) &nbsp; <span class="k">aim</span> = mouse
</div>
<!-- GG/BlazBlue two-fighter HUD: warlock (left, drains left) vs current opponent (right, drains right),
     FIGHT n/N counter in the center, a super/level meter under each. Live-updated from frame() via updateGGHud(). -->
<div id="gghud">
  <div class="row">
    <div class="side l">
      <div class="nm" id="gg-lname">WARLOCK</div>
      <div class="bar"><div class="fill" id="gg-lhp" style="width:100%"></div></div>
      <div class="meter"><div class="mf" id="gg-lmeter"></div></div>
    </div>
    <div class="center">
      <div class="fight" id="gg-fight">FIGHT 1 / 21</div>
      <div class="vs">V S</div>
    </div>
    <div class="side r">
      <div class="nm" id="gg-rname">CHALLENGER</div>
      <div class="bar"><div class="fill" id="gg-rhp" style="width:100%"></div></div>
      <div class="meter"><div class="mf" id="gg-rmeter"></div></div>
    </div>
  </div>
</div>
<div id="wrap"></div>
<div id="err"></div>
<!-- Dragon's-Crown TOUCH CONTROLS: left virtual stick + right verb cluster. Shown only on touch devices
     (or ?touch=1). Wired at the end of the script into the same input globals the keyboard verbs use. -->
<div id="touch" aria-hidden="true">
  <div id="stickBase"><div id="stickNub"></div></div>
  <div id="btns">
    <button class="btn hex"    id="bHex">HEX</button>
    <button class="btn summon" id="bSummon">SUM</button>
    <button class="btn dodge"  id="bDodge">DASH</button>
    <button class="btn ward"   id="bWard">WARD</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script>
const BASE = './assets/spike/';   // Milestone-0 placeholder FX art (shadow/glow)
const SPR  = './assets/sprites/';  // Hiro's real anime art (dark-elf warlock idle sheet)
const BG   = './assets/bg/';       // painted Dragon's-Crown parallax backdrop layers (Hiro drop 2026-06-27)
const WARLOCK_FRAMES = 1;          // warlock_idle.png = Hiro's NEW high-quality single idle still [256x384], normal-mapped (ingested 2026-06-27, replaced the lower-res 6-frame sheet)
// SPRITE SCALE FIX (Hiro's #1 bug: warlock huge / dragon tiny). Size every fighter by its
// TARGET WORLD HEIGHT — NOT its source PNG dims. Render: displayScale = (HERO_PX*SPRITE_TARGET_H[key]) / tex.height,
// then multiply by the perspective/depth scale. Tune HERO_PX to taste; ratios are the contract.
const SPRITE_TARGET_H = {
  warlock_idle:1.0, warlock_walk:1.0, warlock_cast:1.0, warlock_hurt:1.0,
  lich:1.05, archdevil:1.3, demonlord:1.4,
  clawfiend:1.2, bonedragon:2.0, blackdragon:2.0, succubus:0.8, archsuccubus:0.9,
  shambler:1.15, bonearcher:1.05,   // new side-on pit challengers (Hiro drop 2026-06-27)
  // pit.js FIGHTS[] roster foes (Hiro drop 2026-06-27 21:5x) — heights from original hitbox radii
  door:1.5, hook:0.95, chain:1.15, pyre:1.0, gunner:0.95, grave:1.05, stitch:0.95,
  brute:1.35, master:1.1, hound:0.8, necro:1.0, champ:1.3, beast:1.9, skel:0.9,
};
// SCALE-FIX constants (Hiro's #1 bug). HERO_PX = the on-screen pixel height of a 1.0-world-unit
// fighter (the warlock) at the FRONT plane; every sprite renders at (HERO_PX*SPRITE_TARGET_H[key])
// / tex.height, then × the perspective/depth scale. BASE_R = pit.js base hitbox radii, used to
// preserve the binder/herald per-summon size SWELL (a bigger d.r reads as a bigger sprite).
// VIEWPORT (Hiro FEEDBACK #7 #1+#2): canvas fills the whole window and the warlock reads ~⅓ of
// screen height like a Dragon's Crown hero — so HERO_PX must SCALE with the viewport, not be a fixed
// 210px (which shrank to ~15% on a tall window). At the ground line the warlock's perspective sc≈0.96,
// so HERO_PX≈0.355×H lands his on-screen height at ~34% of the viewport. Clamp for tiny/huge windows.
const VIEW_W = Math.max(640, window.innerWidth  || 960);
const VIEW_H = Math.max(480, window.innerHeight || 540);
const HERO_PX = Math.round(Math.min(Math.max(VIEW_H*0.355, 240), 520));
const BASE_R  = { brute:24, dragon:18, succubus:10, zombie:13, archer:10 };   // BUG-006: shambler + bone-archer base hitboxes (pit.js:1019/1030)
// SIDE-ON 1v1 GG GAUNTLET (Hiro locked direction): present the pit as an eye-level side-on duel.
// STATIC SHELL this run — warlock pinned LEFT facing RIGHT, ONE opponent staged RIGHT, the rest of
// the roster frozen as a BACKGROUND lineup, magenta pit ring. Duel loop + camera-whirl land next.
const SIDEON          = true;
const SIDEON_GROUND_FR = 0.84;   // fraction of canvas H where the fighters' feet rest (eye-level)
function showErr(m){document.getElementById('err').textContent += m + '\n';}
window.addEventListener('error', e=>showErr('ERR: '+e.message));

// ---------------------------------------------------------------------------
// COMBAT STATE — mirror of game/src/combat/pit.js shape so downstream systems
// (HUD bars, cooldown overlays, autopilot, abilities, summons, transforms)
// can drop in 1:1 against the original API. Numbers below match pit.js refs.
// ---------------------------------------------------------------------------
const S = { mode:'fight', fight:0, shake:0, hitPause:0, time:0, slow:0, fatal:false };
const P = {
  x:0, y:0, r:16, face:0, hp:45, kills:0, level:1, char:'warlock', form:'human', dead:false,
  // cooldown / timing fields read by the verb gates (pit.js names):
  rollT:0, rollCD:0, heavyCD:0, heavyWind:0, atkRecover:0, atkT:0,
  parryT:0, parryCD:0, channel:null, paralyzeT:0, silenceT:0, fadeT:0,
  hexCD:0, hexCDmax:10, flash:0, wardT:0,
  // stat counters the verbs bump (pit.js P.ft.{rolls,heavy,...})
  ft:{ rolls:0, heavy:0, slash:0 },
  // warlock-specific form flags (stubs for now):
  lich:false, lichRiseT:0, devilT:0, demonLord:false,
  // EVOLUTION state (pit.js): evo10/evo20 = chosen road keys; evoPick = the open choice array
  // (the 2 cards), evoPickT = the MANUAL failsafe countdown, evoTier = 10 or 20 being chosen.
  evo10:null, evo20:null, evoPick:null, evoPickT:0, evoTier:0
};
P.hp = maxHP();   // boot at FULL (the hp:45 literal predates the x2 buff; maxHP() hoists)
const keys = {};                  // 'w','a','s','d','arrowup'... -> bool (pit.js reads keys[...])
const stick = { dx:0, dy:0, on:false };  // analog stick stub (mobile parity later)
let scene = null;                 // set in create(); used by verb FX helpers

// shared sim arrays (pit.js names). enemies[] is a PLACEHOLDER practice roster for now —
// the real 21-fight gauntlet ladder (pit.js FIGHTS:1389) ports in Milestone 4.
const fireballs = [];             // projectile sim (pit.js fireballs[]); hex bolts live here
const enemies  = [];              // foes (pit.js enemies[]); training dummies until gauntlet lands
const demons   = [];              // the warlock's SUMMONS (pit.js demons[]): claw fiend / dragon / coven
const swings   = [];              // transient melee arcs (pit.js swings[]) — brute shove, etc.
const zones    = [];              // lingering ground effects (pit.js zones[]); BONE DRAGON lays 'gas'
const tracers  = [];              // transient beams (pit.js tracers[]); succubus MEND pink line to the warlock
const foeShots = [];              // ENEMY projectiles (pyre embers / gunner shot) — per-type ranged foe AI; damage the warlock

// math helpers (pit.js: dist:~, ang:~, rnd:~)
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function ang(a,b){ return Math.atan2(b.y-a.y, b.x-a.x); }
function rnd(a,b){ return a + Math.random()*(b-a); }
function lvl(){ return Math.min(20, Math.floor(P.level||1)); }   // pit.js:48
function rollDice(n,s){ let t=0; for(let i=0;i<n;i++) t+=1+Math.floor(Math.random()*s); return Math.round(t); }  // pit.js:31 (MODS.dmg=1 here)
function diceN(){ return lvl(); }                                  // pit.js:289 (warlock branch)
function dmgBonus(){ return 6 + P.kills; }                         // pit.js:285 (STR 10, no ronin kit)
function dotDamage(e,d,col){ if(e.dead) return; e.hp-=d; e.flash=Math.max(e.flash,.05);   // pit.js:1555
  scene && scene.popup(e.x+rnd(-7,7), e.y-22, String(d), col); if(e.hp<=0) killEnemy(e); }
function nearestFoe(){ let best=null,bd=1e9; for(const e of enemies){ if(e.dead)continue; const d=dist(P,e); if(d<bd){bd=d;best=e;} } return best; }
// foeDmg — per-foe melee bite. Small, scales loosely with hitbox r so a brute hurts more than a succubus
// (pit.js enemy atk damage is form-specific; this is a faithful-feel stand-in until the real ATK bodies port).
function foeDmg(f){ return Math.round(3 + (f&&f.r?f.r:20)*0.12 + rollDice(1,4)); }   // ~6-12
// hurtWarlock — the foe's lunge connects. WARD (PORTAL grant) and roll/blink i-frames negate it, else
// chip P.hp + red hero flash + shake + damage popup. BUG-005: the HP floor is GONE — warlock death now
// runs the ORIGINAL death->LICH rise (pit.js:1506-1515): kneel 3s, the phylactery dragon answers, then
// enterLich(). A LICH's death is FINAL: SLAIN banner + the current fight restarts after ~2s.
function hurtWarlock(dmg){
  if(P.dead) return;
  if(P.wardT>0){ scene && scene.popup(P.x, P.y-50, 'WARD', '#5ad2ff'); return; }
  if(P.rollT>0 || P.fadeT>0){ scene && scene.popup(P.x, P.y-50, 'DODGE', '#bcd'); return; }   // roll/blink i-frames
  P.hp -= dmg;
  P.flash = 0.14;
  S.shake = Math.max(S.shake, 7);
  scene && scene.popup(P.x+rnd(-6,6), P.y-50, String(dmg), '#ff6a7a');
  if(P.hp<=0){
    if(P.char==='warlock' && !P.lich && !(P.lichRiseT>0) && S.mode==='fight'){
      // death ALWAYS answers the warlock's ledger: he kneels, and the grave sends a dragon (pit.js:1507)
      P.hp=1; P.lichRiseT=3; P.paralyzeT=3;
      P.channel=null; P.heavyWind=0; P.rollT=0; P.parryT=0;
      summonDemons('dragon', true);   // the phylactery rises with him — bypasses the ?solo=1 gate (death is not a dev flag)
      camFocus(P.x,P.y,1.9,2.8);
      flashFx(.3); S.shake=Math.max(S.shake,12); if(navigator.vibrate) navigator.vibrate([60,60,120]);
      showBanner('DEATH SIGNS THE LEDGER','a bone dragon answers — three seconds',2400,'#9af0c0');
      return; }
    // ALREADY a lich (or the rise itself was interrupted) -> death is FINAL (pit.js:1527)
    P.dead=true; P.hp=0;
    leafBurst(P.x,P.y,30,'#c8443a');   // blood stand-in (no bloodPool in the shell)
    showBanner('SLAIN','the ledger closes',2000,'#c8443a');
    setTimeout(()=>{ if(S.mode!=='fight'||!P.dead) return;   // minimal restart: no lose() flow in the shell yet
      P.dead=false; P.lich=false; P.lichRiseT=0; P.r=16; P.hp=maxHP();
      P.channel=null; P.paralyzeT=0; P.fadeT=0; P.heavyWind=0; P.rollT=0; P.devilT=0;
      demons.length=0; foeShots.length=0; fireballs.length=0;
      syncBodyTex(); updateLabels();
      spawnFight(S.fight|0);
      const _f=FIGHTS[S.fight|0];
      scene && scene.banner(_f?_f.name:'THE PIT','again — fight '+((S.fight|0)+1)+' / '+GAUNTLET_N,'#e7b450');
    },2000);
  }
}
// ---------------------------------------------------------------------------
// FIGHTS[] — the real gauntlet ladder, ported 1:1 from pit.js:1389 (M4). 20 fights:
// solo openers -> paired/grouped mid-card -> SIEGE WORKS (4 foes) -> THE FORMER CHAMPION
// -> BELLOW'S SECRET (beast + boss). Names/taunts/foe composition are faithful; HP/spd/r/col
// preserved. ART NOTE: dedicated gladiator side-on sprites aren't generated yet, so each foe
// renders via a STAND-IN key (ranged -> bonearcher, melee -> shambler); a gen-sprites pass for
// door/hook/chain/pyre/gunner/grave/stitch/brute/master/hound/necro/champ/beast is the follow-up.
// ---------------------------------------------------------------------------
const FIGHTS = [

  foes:[{type:'door',hp:90,spd:52,r:26,col:'#7d7468'}]},
 {name:'TWIN HOOKS', taunt:'Pick which of us kills you.',
  foes:[{type:'hook',hp:48,spd:150,r:14,col:'#8a6a4a'},{type:'hook',hp:48,spd:150,r:14,col:'#8a6a4a'}]},
 {name:'THE CHAIN', taunt:'The sand inside my circle belongs to me.',
  foes:[{type:'chain',hp:95,spd:78,r:18,col:'#6f7a6a'}]},
 {name:'PYRE', taunt:'The Pit was a quarry. I will make it a kiln.',
  foes:[{type:'pyre',hp:85,spd:95,r:15,col:'#a4502c',ranged:true}]},
 {name:'THE POWDER SAINT', taunt:'The Pit also takes my bribes.',
  foes:[{type:'gunner',hp:78,spd:115,r:14,col:'#5e5a72',ranged:true}]},
 {name:'THE GRAVE COUNT', taunt:'Swing wildly, please. My blade prefers volunteers.',
  foes:[{type:'grave',hp:120,spd:105,r:16,col:'#5a5e6e'}]},
 {name:'THE STITCHER', taunt:'Break them. I\'ll just sew faster.',
  foes:[{type:'stitch',hp:70,spd:125,r:13,col:'#7a8a6a'},{type:'brute',hp:75,spd:72,r:21,col:'#6a5440'},{type:'brute',hp:75,spd:72,r:21,col:'#6a5440'}]},
 {name:'HOUND MASTER', taunt:'They haven\'t been fed. Apologies.',
  foes:[{type:'master',hp:100,spd:70,r:17,col:'#7a6048'},{type:'hound',hp:66,spd:200,r:11,col:'#4a4038'},{type:'hound',hp:66,spd:200,r:11,col:'#4a4038'},{type:'hound',hp:66,spd:200,r:11,col:'#4a4038'}]},
 {name:'THE GRAVEDIGGER', taunt:'The Pit buries its losers shallow.',

 {name:'THE KENNEL & THE NEEDLE', taunt:'Patch the hounds. Let the famous one tire himself.',

 {name:'LEAD & BONE', taunt:'You shoot, I raise. A fine partnership.',
  foes:[{type:'gunner',hp:156,spd:115,r:14,col:'#5e5a72',ranged:true},{type:'necro',hp:184,spd:100,r:15,col:'#4a5444'}]},
 {name:'THE WALL HOLDS', taunt:'The Door got friends.',
  foes:[{type:'door',hp:180,spd:52,r:26,col:'#7d7468'},{type:'pyre',hp:170,spd:95,r:15,col:'#a4502c',ranged:true},{type:'stitch',hp:140,spd:125,r:13,col:'#7a8a6a'}]},
 {name:'THE COUNT\'S COMPANY', taunt:'Swing wildly. My associates insist.',
  foes:[{type:'grave',hp:240,spd:105,r:16,col:'#5a5e6e'},{type:'hook',hp:96,spd:150,r:14,col:'#8a6a4a'},{type:'hook',hp:96,spd:150,r:14,col:'#8a6a4a'}]},

  foes:[{type:'door',hp:180,spd:52,r:26,col:'#7d7468'},{type:'gunner',hp:156,spd:115,r:14,col:'#5e5a72',ranged:true}]},
 {name:'THE COVEN OF KILNS', taunt:'Fire, frost, or lightning — pick your last word.',
  foes:[{type:'pyre',hp:170,spd:95,r:15,col:'#a4502c',ranged:true},{type:'pyre',hp:170,spd:95,r:15,col:'#b4602c',ranged:true},{type:'stitch',hp:140,spd:125,r:13,col:'#7a8a6a'}]},
 {name:'THE UNDYING WALL', taunt:'We\'ll have him standing before you catch your breath.',

  if(e.type==='grave' && e.stance==='parry'){
    scene && scene.popup(e.x, e.y-30, 'PARRIED', '#e7b450');
    e.tele=0.25; e.teleMax=0.25; e.stance='riposte'; e.stanceT=1.1; e.attacking=false; vib(20);
    return 0;
  }
  // THE WALL frontal guard (pit.js:1187): the door blocks its FRONT. A HEAVY strike BREAKS the guard for 2s
  // (and still bites); a LIGHT strike CLANGs for 25% chip. e.face tracks the warlock, so the only way past is
  // a HEAVY hit or FLANKING — step up/down the depth plane so your hit lands off its facing arc.
  if(e.type==='door' && !(e.brokenT>0)){
    let fd=Math.atan2(P.y-e.y, P.x-e.x)-(e.face||0);
    while(fd>Math.PI)fd-=2*Math.PI; while(fd<-Math.PI)fd+=2*Math.PI;
    if(Math.abs(fd)<0.9){                                  // hit landed on the shielded front
      if(heavy){ e.brokenT=2.0; e.flash=.12;
        scene && scene.popup(e.x, e.y-e.r-16, 'GUARD BROKEN', '#e7b450');
        S.shake=Math.max(S.shake,7); vib(40); return 1; }  // breaks AND the heavy still lands full
      scene && scene.popup(e.x, e.y-e.r-14, 'CLANG — flank or HEAVY', '#9aa0a8');
      S.shake=Math.max(S.shake,3); return 0.25;            // light pings off — chip only
    }
  }
  return 1;
}
// updFoeAI — the GENERIC foe brain (port of pit.js updEnemyVs:1580 helpers: chase / beginAttack /
// telegraphThenHit). Until this landed the roster sprites stood INERT (only DoTs ticked) — this is the
// #1 brawler gap: it makes every foe actually MOVE on the shallow plane (2D chase, up/down + left/right)
// and FIGHT — telegraph -> melee arc -> hurtWarlock, or standoff -> ranged shot for gunner/pyre.
// Per-type AI bodies (door guard-break, grave riposte, master pack-release, pyre 3-spell channel) layer
// on top of this baseline in later runs; the FEEL fields (spd/r/dmgScale) already differentiate them.
const FOE_AI = {   // wind = telegraph seconds, dmg = [min,max] (×dmgScale), standoff for ranged
  door  :{wind:.50, dmg:[10,15], heavy:true,  shake:5},   // THE WALL — slow, big, ground-shaking
  chain :{wind:.60, dmg:[ 9,14], heavy:true,  shake:4, arc:Math.PI*2, range:150},  // ring sweep
  grave :{wind:.42, dmg:[ 7,11], heavy:false, shake:3},
  hook  :{wind:.38, dmg:[ 6,10], heavy:false, shake:3},
  hound :{wind:.42, dmg:[ 4, 7], heavy:false, shake:3, fast:true},   // quick lunge
  brute :{wind:.55, dmg:[10,14], heavy:true,  shake:5},
  champ :{wind:.45, dmg:[ 9,13], heavy:true,  shake:5},
  beast :{wind:.55, dmg:[12,17], heavy:true,  shake:6},
  necro :{wind:.45, dmg:[ 7,11], heavy:false, shake:3},
  master:{wind:.45, dmg:[ 7,10], heavy:false, shake:3},
  stitch:{wind:.40, dmg:[ 3, 6], heavy:false, shake:2, healer:true},  // mostly mends; weak poke
  pyre  :{ranged:true, wind:.80, dmg:[ 9,14], fire:true,  standoff:170, col:'#f0883d'},
  gunner:{ranged:true, wind:.80, dmg:[ 5, 8], fire:false, standoff:200, col:'#ffd24a'},
};
function foeAIFor(e){ return FOE_AI[e.type] || (e.ranged?FOE_AI.gunner:{wind:.4,dmg:[6,10],heavy:false,shake:3}); }

        scene && scene.popup(e.x,e.y-e.r-22,'IT SHEDS ITS CHAINS','#c8443a'); S.shake=Math.max(S.shake,12); vib(60); }
      if(e.chargeWind>0){ e.chargeWind-=dt; e._tele=true;        // charge telegraph (the wind-up tell)
        if(e.chargeWind<=0){ e.chargeT=.5; e.chargeA=ang(e,P); e.rammed=false; e._tele=false; } }
      else if(e.chargeT>0){ e.chargeT-=dt; e._mv=true;           // the ram itself
        e.x+=Math.cos(e.chargeA)*430*dt; e.y+=Math.sin(e.chargeA)*430*dt;
        if(dToP<e.r+(P.r||16)+4 && !e.rammed){ e.rammed=true; hurtWarlock(Math.round(rnd(12,18)*(e.dmgScale||1))); S.shake=Math.max(S.shake,8); }
        if(e.chargeT<=0) e.rammed=false; }
      else if(e.attacking){ e.tele=(e.tele||0)-dt; e._tele=true; // ring-slam wind-up
        if(e.tele<=0){ e.attacking=false; e._tele=false; e.cool=e.phase===2?1.0:1.7;
          S.shake=Math.max(S.shake,11); vib(60);
          swings.push({ x:e.x, y:e.y, a:0, arc:Math.PI*2, range:e.r+85, t:.22, heavy:true, col:'#c8443a', ring:true });
          if(dToP<e.r+85) hurtWarlock(Math.round(rnd(13,19)*(e.dmgScale||1)));
          if(e.phase===2) zones.push({x:P.x,y:P.y,r:50,tele:.55,life:.1,type:'whipcrack',dmg:Math.round(10*(e.dmgScale||1))}); } }
      else { e.face=SIDEON?((P.x>=e.x)?0:Math.PI):ang(e,P);
        if(dToP>e.r+(P.r||16)+38){ const a=ang(e,P); e.x+=Math.cos(a)*spd*dt; e.y+=Math.sin(a)*spd*dt; e._mv=true; } else e._mv=false;
        if(e.cool<=0){
          if(e.phase===2 && dToP>200 && Math.random()<.5){ e.chargeWind=.5; e.cool=2.2;
            scene && scene.popup(e.x,e.y-e.r-22,'!','#c8443a'); }
          else if(dToP<e.r+95){ e.attacking=true; e.tele=.62; e.teleMax=.62;
            scene && scene.popup(e.x,e.y-e.r-18,'SLAM','#c8443a'); } } }
      const mvdb=Math.hypot(e.x-(e._lx??e.x), e.y-(e._ly??e.y));
      e.walkP=(e.walkP||0)+mvdb*.16; e._mv=mvdb>0.2; e._lx=e.x; e._ly=e.y;
      scene && scene.clampArena(e); continue;
    }
    if(e.attacking){                                         // --- telegraph -> resolve (pit.js telegraphThenHit) ---
      e.tele=(e.tele||0)-dt;
      // commit-creep toward the locked aim during the wind-up so the strike reads
      if(!A.ranged && dToP>reach+10){ e.x+=Math.cos(e.lockA||e.face)*spd*.35*dt; e.y+=Math.sin(e.lockA||e.face)*spd*.35*dt; }
      if(e.tele<=0){
        e.attacking=false; e.cool = A.ranged?2.0:rnd(1.0,1.8);
        if(A.ranged){                                        // fire a shot down the lane at the warlock
          const aimX=P.x-e.x, aimY=(P.y-18)-e.y, m=Math.hypot(aimX,aimY)||1;
          foeShots.push({ x:e.x+aimX/m*e.r, y:e.y-10+aimY/m*e.r, vx:aimX/m*380, vy:aimY/m*380,
            r:A.fire?7:5, dmg:Math.round(rnd(A.dmg[0],A.dmg[1])*(e.dmgScale||1)), fire:A.fire, col:A.col });
          scene && scene.popup(e.x,e.y-e.r-14, A.fire?'PYRE':'FIRE', A.col); S.shake=Math.max(S.shake,3);
        }else{                                               // melee arc + damage if the warlock is still in front + in reach
          const arc=A.arc||1.6, range=A.range||(reach+30);
          swings.push({ x:e.x, y:e.y, a:e.face, arc, range, t:.14, heavy:!!A.heavy, col:e.col||'#c8443a', ring:!!A.arc });
          S.shake=Math.max(S.shake, A.shake||3); if(navigator.vibrate&&A.heavy) navigator.vibrate(18);
          if(dToP<range+4){
            let da=ang(e,P)-(e.lockA||e.face); while(da>Math.PI)da-=2*Math.PI; while(da<-Math.PI)da+=2*Math.PI;
            if(A.arc>3 || Math.abs(da)<1.3) hurtWarlock(Math.round(rnd(A.dmg[0],A.dmg[1])*(e.dmgScale||1)));
          }
        }
      }
    }else if(A.ranged){                                      // --- ranged idle: keep the standoff, then aim+fire ---
      const so=A.standoff||180;
      if(dToP<so){ const a=ang(P,e); e.x+=Math.cos(a)*spd*dt; e.y+=Math.sin(a)*spd*dt; }   // back away
      else if(dToP>so*2.2){ const a=ang(e,P); e.x+=Math.cos(a)*spd*.6*dt; e.y+=Math.sin(a)*spd*.6*dt; }  // close if too far
      if(e.cool<=0 && dToP<520){ e.attacking=true; e.tele=A.wind; e.teleMax=A.wind; e.lockA=ang(e,P);
        scene && scene.popup(e.x,e.y-e.r-14,'AIM','#ffd24a'); }
    }else{                                                   // --- melee idle: chase, then telegraph a strike ---
      if(dToP>reach+22){ const a=ang(e,P); const ms=spd*(A.fast?1.25:1);
        e.x+=Math.cos(a)*ms*dt; e.y+=Math.sin(a)*ms*dt; e._mv=true; }
      else e._mv=false;
      if(e.cool<=0 && dToP<reach+40){ e.attacking=true; e.tele=A.wind; e.teleMax=A.wind; e.lockA=ang(e,P);
        scene && scene.popup(e.x,e.y-e.r-16,'!','#c8443a'); }
    }
    const mvd=Math.hypot(e.x-(e._lx??e.x), e.y-(e._ly??e.y));   // walk-phase bookkeeping for the render pose-swap
    e.walkP=(e.walkP||0)+mvd*.16; e._mv=mvd>0.2; e._lx=e.x; e._ly=e.y;
    scene && scene.clampArena(e);
  }
}
// updFoeShots — ENEMY projectile sim (pyre ember / gunner shot). Mirrors updFireballs but in reverse: the
// foe's ranged AI spawns these, they fly at the warlock, and on contact call hurtWarlock(). Render-light:
// reuses scene.fxTrail for the streak. Roll/ward/fade i-frames are honoured inside hurtWarlock itself.
function updFoeShots(dt){
  for(let i=foeShots.length-1;i>=0;i--){ const s=foeShots[i];
    s.x+=s.vx*dt; s.y+=s.vy*dt;
    scene && scene.fxTrail(s.x, s.y, 'fire');
    if(!P.dead && Math.hypot(s.x-P.x, s.y-(P.y-18)) < (P.r||16)+s.r){
      hurtWarlock(s.dmg);
      scene && scene.popup(P.x, P.y-58, s.fire?'BURN':'HIT', s.col||'#ffd24a');
      if(s.fire) S.shake=Math.max(S.shake,4);
      foeShots.splice(i,1); continue;
    }
    if(scene && scene.outOfArena(s.x,s.y)) foeShots.splice(i,1);
  }
}

// Each currently emits a PLACEHOLDER FX + sets the same cooldown the original
// uses, so the feel/gating is right before the real ability bodies are ported.
function autoFace(){ if(scene) P.face = scene.aimAngle(); }

function doSlash(){ // warlock base => HEX bolt (pit.js:307 -> hexBolt:565)
  if(P.lichRiseT>0){ scene && scene.popup(P.x,P.y-58,'THE PACT HOLDS','#9af0c0'); return; }   // BUG-005 kneel
  if(S.mode!=='fight'||P.dead||P.atkRecover>0||P.heavyWind>0||P.rollT>0||P.channel||P.paralyzeT>0) return;
  if(P.devilT>0){ devilClaw(); return; }   // ARCH DEVIL light verb => CLAW (pit.js:310), not HEX
  if(P.lich){ lichSlash(); return; }       // LICH light verb => SCYTHE (pit.js:309), not HEX
  if(P.hexCD>0) return;
  P.hexCD = (P.evo10==='herald'?3:10); P.atkRecover=0.18;  // herald 3s else 10s (pit.js:565-567)
  const f=nearestFoe(); if(f) P.face=ang(P,f); else autoFace();   // pit.js:568 faces nearest foe
  // SIDEON HEX (Hiro 2026-07-09: "should only go straight across the screen"): the free mouse
  // angle let the bolt fly "in 3D" up/down the depth plane. In side-on the hex flies FLAT down
  // the lane — direction reduced to the facing SIGN, vy forced to 0; BOLT_LIFT renders it at
  // his mid-section. (The top-down fallback view keeps the free angle.)
  if(SIDEON) P.face = (Math.cos(P.face)<0) ? Math.PI : 0;
  fireballs.push({ x:P.x+Math.cos(P.face)*14, y:P.y+Math.sin(P.face)*14-18,   // pit.js:569
    vx:Math.cos(P.face)*420, vy:SIDEON?0:Math.sin(P.face)*420, r:5, kind:'hex' });
  scene && scene.fxHexCast(P.face);
}

// ---- ARCH DEVIL VERBS (port of pit.js:903-940) — the borrowed form trades HEX/SUMMON for CLAW/BITE.
// In the side-on duel the warlock fights ONE foe (currentFoe); CLAW dashes in for a 2.0x carve, BITE is a
// moderate 1.0x strike that ASCENDS a succubus assist if one is in lane (feeding both), else carves the foe.
function devilClaw(){ // CLAW: roll to the foe, then a massive hit (pit.js:903)
  if(P.atkRecover>0 || P.hexCD>0) return;                       // shares the light-verb cadence
  P.hexCD = (P.evo10==='herald'?3:10);                          // same gate the HEX it replaces uses
  const f=currentFoe(); if(!f){ devilStrike(2.0,false); return; }
  P.face=ang(P,f);
  if(dist(P,f) > P.r+f.r+12){                                   // rolling dash that lands beside the foe (pit.js:907)
    P.x = f.x-Math.cos(P.face)*(f.r+P.r+6);
    P.y = f.y-Math.sin(P.face)*(f.r+P.r+6);
    scene && scene.clampArena(P);
    scene && scene.fxPortal(P.x,P.y);                           // red dash sparks stand-in (leafBurst)
    S.shake=Math.max(S.shake,5);
  }
  devilStrike(2.0,false);
}
function devilStrike(mult,heals){ // CLAW(2.0) / BITE(1.0,heals) carve (pit.js:917)
  P.atkRecover = 0.18*(mult>1.5?1.3:0.9);
  P.face = scene ? scene.aimAngle() : P.face;
  const f=currentFoe(); if(f) P.face=ang(P,f);                  // face the duel foe
  swings.push({ x:P.x, y:P.y, a:P.face, arc:2.0, range:98, t:.16, heavy:mult>1.5, col:'#d03a4a' });
  S.shake=Math.max(S.shake, mult>1.5?7:4); vib(mult>1.5?35:18);
  const dmg=Math.round((rollDice(diceN(),8)+dmgBonus())*mult);
  if(heals){                                                    // BITE feeds him — ASCEND a succubus assist (pit.js:929)
    const sc=demons.find(d=>d.hp>0 && d.type==='succubus' && !d.arch);
    if(sc){ sc.arch=true; sc.r=15; sc.archT=7; leafBurst(sc.x,sc.y,14,'#f06aa0');
      scene && scene.popup(sc.x,sc.y-sc.r-24,'ARCH SUCCUBUS','#f06aa0');
      showBanner('ARCH SUCCUBUS','she BURSTS in 7 — Portal away.',1700,'#d03a4a'); return; }
  }
  if(!f) return;                                                // summons gone or no foe — the swing still played
  let diff=ang(P,f)-P.face; while(diff>Math.PI)diff-=2*Math.PI; while(diff<-Math.PI)diff+=2*Math.PI;
  if(dist(P,f)<98+f.r && Math.abs(diff)<1.2){
    const gm=foeGuard(f, mult>1.5, P.face);                     // 0 parry · .25 door chip · 1 clean
    if(gm>0){ const dd=Math.round(dmg*gm);
      f.hp-=dd; f.flash=.14; scene && scene.fxPortal(f.x,f.y);
      scene && scene.popup(f.x,f.y-30, dd+(heals?' BITE':' CLAW'), '#d03a4a');
      S.shake=Math.max(S.shake, mult>1.5?7:4);
      if(f.hp<=0) killEnemy(f, mult>1.5?'CARVED':'DEVOURED', '#d03a4a');
    }
  }
}
// ---- LICH VERB (port of pit.js:998) — the reaper trades HEX for the SCYTHE: light harm, heavy law.
// Side-on duel: a green arc on currentFoe() that REAPS — half-dice dmg, a 5s stun + a long knockback hurl.
// (Q stays SUMMON for the lich; K=FADE reroute still pending — see STATUS.)
function lichSlash(){ // SCYTHE (pit.js:998)
  if(P.fadeT>0){ scene && scene.popup(P.x,P.y-44,'FADED — only the dead answer','#8a93a8'); return; }
  if(P.atkRecover>0 || P.hexCD>0) return;                       // shares the light-verb cadence
  P.hexCD = (P.evo10==='herald'?3:10);                          // same gate the HEX it replaces uses
  P.atkRecover = 0.18*1.3; P.ft.slash++;                        // pit.js: atkRec()*1.3
  const f=currentFoe(); if(f) P.face=ang(P,f); else P.face = scene?scene.aimAngle():P.face;
  swings.push({ x:P.x, y:P.y, a:P.face, arc:2.2, range:96, t:.18, heavy:true, col:'#9af0c0' });
  S.shake=Math.max(S.shake,6); vib(30);
  const dmg=Math.round((rollDice(Math.max(1,Math.ceil(diceN()/2)),8)+Math.floor(dmgBonus()/2))*0.8*(P.evo10==='binder'?2:1)); // DREADBINDER scythe x2 (pit.js:1001)
  if(!f) return;                                                // swing still played, no foe to reap
  let diff=ang(P,f)-P.face; while(diff>Math.PI)diff-=2*Math.PI; while(diff<-Math.PI)diff+=2*Math.PI;
  if(dist(P,f)<96+f.r && Math.abs(diff)<1.1){
    const gm=foeGuard(f, true, P.face);                          // scythe is always heavy → door guard BREAKS, gm 1; grave parry gm 0
    if(gm>0){
      const pa=ang(P,f); f.x+=Math.cos(pa)*220; f.y+=Math.sin(pa)*220; scene && scene.clampArena(f); // hurled across the sand (pit.js:1011)
      f.stunT=Math.max(f.stunT||0,5); f._tele=false; f.flash=.14;  // 5s stun freezes the foe AI (frame L1044)
      scene && scene.fxPortal(f.x,f.y);
      scene && scene.popup(f.x,f.y-44,'REAPED — STUNNED','#9af0c0');
      const dd=Math.round(dmg*gm); f.hp-=dd; scene && scene.popup(f.x,f.y-30, dd+' SCYTHE','#9af0c0');
      S.shake=Math.max(S.shake,6);
      if(f.hp<=0) killEnemy(f,'REAPED','#9af0c0');
    }
  }
}

// updateGGHud — drive the GG/BlazBlue two-fighter HUD each frame (side-on duel presentation).
// LEFT = the warlock (hp/maxHP, drains left; super meter = level toward 20). RIGHT = the CURRENT
// opponent (drains right). CENTER = "FIGHT n / N". Names reflect the active form / foe type.
// Pure DOM read of the pit.js-shaped state; safe no-op if the nodes are missing.
function updateGGHud(){
  const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.style.width=v; };
  const txt=(id,v)=>{ const el=document.getElementById(id); if(el && el.textContent!==v) el.textContent=v; };
  // left fighter = warlock; name follows the active form
  const lform = P.demonLord?'DEMON LORD':(P.devilT>0?'ARCH DEVIL':(P.lich?'LICH':'WARLOCK'));
  txt('gg-lname', lform);
  const lhp = Math.max(0, Math.min(1, P.hp/(maxHP()||1)));
  set('gg-lhp', (lhp*100).toFixed(1)+'%');
  set('gg-lmeter', (Math.min(20,P.level||1)/20*100).toFixed(0)+'%');   // super/level meter
  // right fighter = the current single opponent (background lineup waits its turn)
  const f=currentFoe();
  if(f){ const rhp=Math.max(0,Math.min(1,f.hp/(f.maxhp||f.hp||1)));
    set('gg-rhp', (rhp*100).toFixed(1)+'%');
    txt('gg-rname', (f.name||'CHALLENGER').toUpperCase());
    set('gg-rmeter', f.hexT>0?'100%':'0%');   // foe "meter" = hexed indicator stub
  } else if(window.ADV && ADV.on && ADV.mode!=='pit'){                      // town: no opponent — show place + purse instead of "— DEFEATED —"
    set('gg-rhp','0%'); txt('gg-rname', (ADV.mode==='village'?'KARRIDGE':'THE OLD ROAD')); set('gg-rmeter','0%');
  } else { set('gg-rhp','0%'); txt('gg-rname','— DEFEATED —'); set('gg-rmeter','0%'); }
  txt('gg-fight', (window.ADV && ADV.on && ADV.mode!=='pit') ? (ADV.objective||'KARRIDGE')
                : 'FIGHT '+Math.min(gauntletN(),(S.fight|0)+1)+' / '+gauntletN());
}

// fade — the LICH defensive verb (pit.js:991). Replaces PORTAL while P.lich: the reaper steps OUT of
// reach for 5s (10s on the DREADBINDER/lich road), beyond targeting — hurtWarlock() already negates all

function rigEase(name,u){
  if(name==='quadOut')   return 1-(1-u)*(1-u);
  if(name==='quadInOut') return u<0.5 ? 2*u*u : 1-2*(1-u)*(1-u);
  return 0.5-0.5*Math.cos(Math.PI*u);               // sineInOut (the default; never linear, per plan)
}
function rigEval(kf,t,ease){                         // piecewise EASED interpolation over [t,v] keys
  if(t<=kf[0][0]) return kf[0][1];
  for(let i=1;i<kf.length;i++) if(t<=kf[i][0]){
    const a=kf[i-1], b=kf[i], span=b[0]-a[0];
    const u=Math.min(1, Math.max(0, span>0?(t-a[0])/span:1));   // clamp float noise at key edges
    return a[1]+(b[1]-a[1])*rigEase(ease,u);
  }
  return kf[kf.length-1][1];
}

// ---- PHASE 2B.3 (ANIM_COMBAT_OVERHAUL): Warlock cutout-rig VALIDATION. Pure data checks with NO
// Phaser dependencies, so the exact same function can be dry-run under plain node against the real
// JSON files (the phase's acceptance check). Validates: the bind graph (every parent declared
// before use — which also rules out cycles), sprite<->pivot coverage against the 2B.2 manifest,
// and every timing-template track: known node targets, well-formed [t,value] keys (t strictly
// ascending in 0..1), an ease named (plan: eased, never linear), loop endpoint continuity, the
// robe's followTorso secondary-motion lag, and the attack's impact-freeze plateau.
function rigValidate(pivots, rig){
  const errors=[], warnings=[];
  if(!pivots||!pivots.parts) return {errors:['pivots manifest missing/malformed'], warnings, stats:{}};
  if(!rig||!rig.bind||!Array.isArray(rig.bind.nodes)||!rig.actions)
    return {errors:['rig data missing bind.nodes/actions'], warnings, stats:{}};
  const seen=new Set(['root']);
  for(const n of rig.bind.nodes){
    if(!n.name){ errors.push('bind node without a name'); continue; }
    if(seen.has(n.name)) errors.push('duplicate node: '+n.name);
    if(!seen.has(n.parent)) errors.push(n.name+": parent '"+n.parent+"' not declared before it");
    if(n.sprite){
      const pv=pivots.parts[n.sprite];
      if(!pv) errors.push(n.name+": sprite '"+n.sprite+"' has no pivot entry (2B.2 manifest)");
      else{
        if(!(Array.isArray(pv.pivot)&&pv.pivot.length===2)) errors.push(n.sprite+': malformed pivot');
        // 2B.5 FIX: parts must carry their own scale data (worldH fraction + measured alphaH px)
        if(!(pv.worldH>0 && pv.worldH<=1.2)) errors.push(n.sprite+': missing/bad worldH (fraction of figure height)');
        if(!(pv.alphaH>0)) errors.push(n.sprite+': missing/bad alphaH (measured opaque px height)');
      }
    }
    seen.add(n.name);
  }
  for(const pname in pivots.parts)
    if(!rig.bind.nodes.some(n=>n.sprite===pname)) warnings.push('pivot part unused by bind: '+pname);
  const CH=['rot','x','y'];
  for(const aname in rig.actions){
    const act=rig.actions[aname];
    if(!(act.dur>0)) errors.push(aname+': bad dur');
    for(const tname in act.tracks){
      if(tname!=='root' && !seen.has(tname)){ errors.push(aname+'.'+tname+': unknown node target'); continue; }
      const tr=act.tracks[tname];
      if(!tr.ease) warnings.push(aname+'.'+tname+': no ease named (plan: eased, not linear)');
      let any=false;
      for(const ch of CH){ const kf=tr[ch]; if(!kf) continue; any=true;
        let pt=-1, bad=false;
        if(!Array.isArray(kf)||kf.length<2){ errors.push(aname+'.'+tname+'.'+ch+': needs >=2 keyframes'); continue; }
        for(const k of kf){
          if(!Array.isArray(k)||k.length!==2||typeof k[0]!=='number'||typeof k[1]!=='number'){ errors.push(aname+'.'+tname+'.'+ch+': bad key'); bad=true; break; }
          if(k[0]<0||k[0]>1||k[0]<=pt){ errors.push(aname+'.'+tname+'.'+ch+': t not strictly ascending within 0..1'); bad=true; break; }
          pt=k[0];
        }
        if(!bad && act.loop && kf[0][1]!==kf[kf.length-1][1])
          warnings.push(aname+'.'+tname+'.'+ch+': loop endpoints differ (will pop)');
      }
      if(!any && !tr.followTorso) warnings.push(aname+'.'+tname+': empty track');
      if(tr.followTorso && !(tr.followTorso.lag>0)) errors.push(aname+'.'+tname+': followTorso needs lag>0');
    }
  }
  const atk=rig.actions.attack;
  if(atk && atk.tracks['arm_staff_shoulder'] && atk.tracks['arm_staff_shoulder'].rot){
    const kf=atk.tracks['arm_staff_shoulder'].rot; let hold=false;
    for(let i=1;i<kf.length;i++) if(kf[i][1]===kf[i-1][1] && (kf[i][0]-kf[i-1][0])>=0.08) hold=true;
    if(!hold) warnings.push('attack: no impact-freeze plateau (>=0.08 of dur) on the strike arm');
  }
  for(const aname in rig.actions){
    const r=rig.actions[aname].tracks['robe_lower'];
    if(r && !r.followTorso) warnings.push(aname+': robe_lower has no followTorso (secondary-motion lag)');
  }
  return {errors, warnings,
          stats:{nodes:rig.bind.nodes.length, sprites:rig.bind.nodes.filter(n=>n.sprite).length,
                 actions:Object.keys(rig.actions).length}};
}

// ---- master tick (mirror of pit.js frame(now)) ----------------------------
function frame(dt){            // dt in seconds
  S.time += dt;
  // EVOLUTION choice open -> FROZEN scene: resolve the pick, run NOTHING else (pit.js drawEvoPanel path).
  // evoTick auto-defaults under AUTO/headless and on the failsafe timeout, so this can never softlock.
  if(P.evoPick){ evoTick(dt); return; }
  // decay cooldown timers (pit.js does the same each frame)
  for(const k of ['rollT','rollCD','heavyCD','heavyWind','atkRecover','parryT','parryCD','hexCD','paralyzeT','silenceT','fadeT','wardT','flash'])
    if(P[k]>0) P[k] = Math.max(0, P[k]-dt);
  // ARCH DEVIL timer -> outro on expiry (pit.js frame devil tick). DEMON LORD is terminal (no timer).
  if(P.devilT>0 && !P.demonLord){ P.devilT-=dt; if(P.devilT<=0){ P.devilT=0; archDevilOutro(); } }
  // DEATH->LICH kneel (pit.js:2239-2242, BUG-005): three seconds where death watches him change.
  if(P.lichRiseT>0){ P.lichRiseT-=dt; if(P.lichRiseT<=0){ P.lichRiseT=0; P.paralyzeT=0; enterLich(); } }
  // SUMMON LADDER — port of pit.js channel tick (:2285). Press auto-channels; the rungs
  // fire on their own at t1/t2/t3 (3s/4s/6s; DEMON LORD .5/1/3s), gated by level + "one alive".
  if(P.channel){ const c=P.channel; c.t+=dt;
    const _dl=P.demonLord; const t1=_dl?0.5:3, t2=_dl?1:4, t3=_dl?3:6;
    if(c.t>=t1 && !c.b){ c.b=true;                                    // rung 1: CLAW FIEND
      if(!demons.some(d=>d.type==='brute'&&d.hp>0)){ c.any=true; summonDemons('brute'); }
      else scene && scene.popup(P.x,P.y-58,'FIEND LIVES','#8a93a8'); }
    if(c.t>=t2 && !c.d){ c.d=true;                                    // rung 2: BONE DRAGON (level 3+)
      if(SOLO) scene && scene.popup(P.x,P.y-58,'SOLO: FIEND ONLY','#8a93a8');   // dragon gated in solo
      else if(lvl()<3) scene && scene.popup(P.x,P.y-58,'DRAGON AT LEVEL 3','#8a93a8');
      else if(!demons.some(d=>d.type==='dragon'&&d.hp>0)){ c.any=true; summonDemons('dragon'); }
      else scene && scene.popup(P.x,P.y-58,'DRAGON LIVES','#8a93a8'); }
    if(c.t>=t3){                                                      // rung 3: THE COVEN (level 5+) -> devil
      if(SOLO){ /* coven + devil transform gated in solo (claw fiend only) */ }
      else if(lvl()<5) scene && scene.popup(P.x,P.y-58,'COVEN AT LEVEL 5','#8a93a8');
      else if(!demons.some(d=>d.type==='succubus'&&d.hp>0)){ c.any=true; summonDemons('succubus'); if(!_dl) enterDevil(); }
      else scene && scene.popup(P.x,P.y-58,'COVEN LIVES','#8a93a8');
      P.channel=null; }                                              // auto-channel completes here (no fizzle)
  }

  updFireballs(dt); updEnemies(dt); updFoeAI(dt); updFoeShots(dt); updDemons(dt); updSwings(dt); updZones(dt); updTracers(dt);   // status DoTs THEN foe brain (chase+telegraph+strike) + summons + arcs + gas + mend beams + foe shots (pit.js:1580,632,2364)
  // WAVE ADVANCE (M4): the whole fight cleared -> roll to the next FIGHTS[] wave (pit.js nextFight:1953).
  // Safe here: every upd* loop above has finished iterating enemies[] for this frame, so spawnFight()

}

  // --- RUNTIME KEYFRAME LOADER (FEEDBACK #8): read anims.json, queue every listed keyframe (diffuse +
  // auto-Sobel normal so Light2D shades the cycle), and register a Phaser anim per set once loaded.
  // Degrades to the still-pose + procedural locomotion when a set is missing — build always loadable.
  loadAnimFrames(){
    this.animSets = {};                        // '<ent>_<act>' -> {key:'anim_<set>', frames:N}
    const man = this.cache.json.get('anims_manifest');
    if(!man || typeof man!=='object') return;
    const total={};
    const reg=(setName)=>{                     // register a set the moment ITS frames are in — with 56 sets
      const frames=[];                         // (~670 files) waiting for the WHOLE queue would leave the cast
      for(let i=1;i<=total[setName];i++)       // on stills for seconds after boot (caught by the 17:03 audit).
        if(this.textures.exists(setName+'_'+i)) frames.push({key:setName+'_'+i});
      if(frames.length<2) return;
      const akey='anim_'+setName;
      // PHASE 2 (ANIM_COMBAT_OVERHAUL): yoyo ping-pong (1-2-3-2-1) was a crutch for the old 3-keypose
      // sets — a hard loop snapped 3->1 every cycle. Real cycles (>=4 frames: the new 8-frame walks /
      // 6-frame attacks) loop FORWARD at 12+fps with no snap-back. Legacy <=3-frame sets keep the yoyo
      // until they're regenerated; 2-3 frame idles keep the slow yoyo too (breathing IS a ping-pong).
      if(!this.anims.exists(akey)){
        const few = frames.length < 4;
        this.anims.create({key:akey, frames,
          frameRate: /_idle$/.test(setName) ? 5 : (few ? 9 : 14),
          yoyo: few, repeat:-1});
      }
      this.animSets[setName]={key:akey, frames:frames.length};
      // PHASED SUMMON (Hiro 2026-07-07): the channel is NOT one loop. From the summoning sheet:
      // INTRO 1-2-3-4-5 plays once at cast start, 5-6 PULSES slowly while the channel holds, and
      // 6-7-8 resolves ONCE on release. The generic looping set above stays as a fallback.
      if(setName==='warlock_summon' && frames.length>=8){
        const F=i=>({key:'warlock_summon_'+i});
        if(!this.anims.exists('anim_warlock_summon_in'))
          this.anims.create({key:'anim_warlock_summon_in',   frames:[1,2,3,4,5].map(F), frameRate:9, repeat:0});
        if(!this.anims.exists('anim_warlock_summon_loop'))
          this.anims.create({key:'anim_warlock_summon_loop', frames:[5,6].map(F),       frameRate:4, repeat:-1});
        if(!this.anims.exists('anim_warlock_summon_out'))
          this.anims.create({key:'anim_warlock_summon_out',  frames:[6,7,8].map(F),     frameRate:9, repeat:0});
      }
    };
    // TWO-PHASE PRIORITY (deterministic): phase 1 loads ONLY the hero + the current wave's foes so the
    // fighters on screen get their cycles in the first beats of boot; phase 2 streams the whole rest of
    // the roster behind them. Each phase registers its sets on that phase's 'complete'.
    const hot=new Set(['warlock']); for(const e of enemies){ if(!e.dead && e.spriteKey) hot.add(e.spriteKey); }
    const isHot=n=>{ for(const k of hot) if(n.indexOf(k+'_')===0) return true; return false; };
    const phases=[[],[]];
    for(const setName in man){
      const n=man[setName]|0; if(n<2) continue;
      total[setName]=n;
      phases[isHot(setName)?0:1].push(setName);
    }
    const queue=(names)=>{ let any=false;
      for(const sn of names) for(let i=1;i<=total[sn];i++){ const fk=sn+'_'+i;
        if(this.textures.exists(fk)) continue;
        // BOOT_V cache-bust: frame files get overwritten in place by the pipeline — never trust cache
        this.load.image(fk, [SPR+fk+'.png?v='+BOOT_V, SPR+fk+'_n.png?v='+BOOT_V]); any=true; }
      return any; };
    const run=(pi)=>{
      if(pi>=phases.length) return;
      const names=phases[pi];
      if(!queue(names)){ names.forEach(reg); run(pi+1); return; }
      this.load.once('complete', ()=>{ names.forEach(reg); run(pi+1); });
      this.load.start();
    };
    run(0);
  }
  // --- PHASE 2B.3 (ANIM_COMBAT_OVERHAUL): build the Warlock cutout-rig hierarchy from
  // warlock_rig.json (bind tree + timing templates) + the 2B.2 pivot manifest. Every node is a
  // Phaser container positioned at its JOINT relative to its parent; a node's sprite sits at
  // (0,0) with origin = its pivot, so rotating the container rotates the part around the joint.
  // Draw order = bind list order within a parent (back->front): far staff-arm subtree first
  // (behind), then robe_lower, torso body, head, then the near off-arm + tome in front —
  // forearms are listed after their upper arms so they draw OVER the joint-overlap flaps (the
  // part art extends past each joint; plan 2B.3 quality technique (a)).
  // INERT THIS PHASE: the root is created HIDDEN and nothing drives it — playback is 2B.4, so
  // today's build renders exactly as before. Guarded so a missing piece can never break boot.
  buildWarlockRig(){
    try{
      const piv=this.cache.json.get('rig_pivots'), rig=this.cache.json.get('rig_data');
      const v=(typeof rigValidate==='function')?rigValidate(piv,rig):{errors:['no validator'],warnings:[],stats:{}};
      if(v.errors.length){ console.warn('[RIG] template validation FAILED:', v.errors.join(' | ')); return null; }
      if(v.warnings.length) console.warn('[RIG] template warnings:', v.warnings.join(' | '));
      const nodes={root:this.add.container(0,0)};
      for(const nd of rig.bind.nodes){
        const parent=nodes[nd.parent];
        if(!parent){ console.warn('[RIG] missing parent '+nd.parent); return null; }
        const c=this.add.container(nd.pos?nd.pos[0]:0, nd.pos?nd.pos[1]:0);
        parent.add(c);                                   // add order = draw order inside the parent
        if(nd.sprite){
          if(!this.textures.exists(nd.sprite)){ console.warn('[RIG] missing texture '+nd.sprite); return null; }
          const pv=piv.parts[nd.sprite];
          const s=this.add.sprite(0,0,nd.sprite).setPipeline('Light2D');
          // 2B.5 FIX (1): per-part SCALE from the manifest — every part PNG is ~512px tall
          // regardless of anatomy, so each scales to its own reference proportion:
          // scale = nominalH * worldH(fraction of figure height) / alphaH(measured opaque px).
          s.setScale((rig.nominalH||460)*(pv.worldH||0.25)/(pv.alphaH||512));
          // 2B.5 FIX (2): flipX parts generated facing the wrong way (robe_lower's boots pointed
          // LEFT) — mirror the texture AND the pivot x so the joint stays anatomically put.
          // Interim until the part is regenerated facing right (lighting mirrors with it).
          if(pv.flipX){ s.setFlipX(true); s.setOrigin(1-pv.pivot[0], pv.pivot[1]); }
          else s.setOrigin(pv.pivot[0], pv.pivot[1]);
          c.add(s); c._sprite=s;
        }
        c._bind={x:(nd.pos?nd.pos[0]:0), y:(nd.pos?nd.pos[1]:0)};   // rest pose (tracks offset from this)
        nodes[nd.name]=c;
      }
      nodes.root.setVisible(false);   // 2B.3: hierarchy only — 2B.4 wires playback and shows it
      console.log('[RIG] build OK: '+v.stats.nodes+' nodes, '+v.stats.sprites+' sprites, '+v.stats.actions+' actions');
      return {root:nodes.root, nodes, data:rig, pivots:piv};
    }catch(e){ console.warn('[RIG] build error: '+(e&&e.message)); return null; }
  }
  // PHASE 2B.4: start a timing-template action. A looping action that's already playing keeps its
  // phase (no restart pop); one-shots (attack) always restart from t=0.
  rigPlay(name){
    const R=this.warlockRig; if(!R || !R.data.actions[name]) return;
    if(this._rigAction===name && R.data.actions[name].loop) return;
    this._rigAction=name; this._rigT=0;
  }
  // PHASE 2B.4: evaluate the current template at the clock and pose every node — bind pose +
  // eased track offsets, CONTINUOUS interpolation (no discrete pose snapping; the attack's
  // t=0.42-0.54 value plateau IS the impact freeze). The robe's followTorso adds
  // evalTorso(t-lag)*amp - evalTorso(t) as a LOCAL delta — it already inherits the torso's true
  // rotation by parenting, so this term is pure cloth LAG (plan 2B.3 technique (b)).
  rigUpdate(rdt){
    const R=this.warlockRig; if(!R) return;
    if(!this._rigAction) this._rigAction='idle';
    const act=R.data.actions[this._rigAction]; if(!act) return;
    this._rigT=(this._rigT||0)+Math.max(0,rdt||0);
    let t=this._rigT/act.dur;
    t = act.loop ? t-Math.floor(t) : Math.min(1,t);
    for(const nm in R.nodes){ const c=R.nodes[nm]; if(nm==='root') continue;
      c.rotation=0; c.x=c._bind.x; c.y=c._bind.y; }
    this._rigRootDX=0;
    const torso=act.tracks['torso'];
    for(const tn in act.tracks){
      const tr=act.tracks[tn];
      const node = tn==='root' ? null : R.nodes[tn];
      if(tn!=='root' && !node) continue;
      if(tr.rot && node) node.rotation += rigEval(tr.rot,t,tr.ease);
      if(tr.x){ if(tn==='root') this._rigRootDX=rigEval(tr.x,t,tr.ease); else node.x += rigEval(tr.x,t,tr.ease); }
      if(tr.y && node) node.y += rigEval(tr.y,t,tr.ease);
      if(tr.followTorso && node && torso && torso.rot){
        let lt = t - (tr.followTorso.lag/act.dur);
        lt = act.loop ? lt-Math.floor(lt) : Math.max(0,lt);
        node.rotation += rigEval(torso.rot,lt,torso.ease)*(tr.followTorso.amp||1) - rigEval(torso.rot,t,torso.ease);
      }
    }
  }
  create(){

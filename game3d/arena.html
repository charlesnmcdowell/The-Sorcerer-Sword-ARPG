  // --- CAMERA POST-FX GRADE (Hiro FEEDBACK #6 B-2) — the single highest-leverage push from ~80% -> ~90%
  // DRAGON'S CROWN LOOK. Applies a main-camera post-pipeline (composited AFTER the whole scene + Light2D
  // sprites render) to get Vanillaware's PAINTERLY glow + contrast: (1) a warm, mildly-contrasty, slightly
  // saturated ColorMatrix GRADE; (2) soft BLOOM for the dreamy magic-lit halo; (3) a VIGNETTE that frames
  // the brawl and deepens the pit's edges. PURELY VISUAL — touches no sim/combat/targeting/render path.
  // WebGL-only (postFX is a WebGL feature); guarded + try/caught so a Canvas fallback stays loadable. ---
  applyCameraGrade(){
    try{
      const cam = this.cameras && this.cameras.main;
      if(!cam || !cam.postFX || (this.renderer && this.renderer.type !== Phaser.WEBGL)) return;
      // (1) WARM GRADE: a single custom 4x5 ColorMatrix combining ~1.16 saturation, ~1.08 contrast (around
      // 0.5, so it also deepens shadows), and a warm tint (R x1.04 / B x0.94). Hand-composed so it's one
      // deterministic call rather than chained presets. Offsets (~ -0.04) darken slightly for the painterly
      // contrast Vanillaware leans on.
      const cm = cam.postFX.addColorMatrix();
      cm.set([
         1.265, -0.1285, -0.0130, 0, -0.0416,
        -0.0367, 1.1292, -0.0125, 0, -0.0400,
        -0.0345, -0.1162, 1.1660, 0, -0.0376,
         0,       0,       0,      1,  0
      ]);
      // (2) SOFT BLOOM: warm-white halo over the magic FX / rim light. Moderate strength so it glows
      // without washing the art out. addBloom(color, offsetX, offsetY, blurStrength, strength, steps).
      cam.postFX.addBloom(0xffe6c0, 1, 1, 1.05, 0.58, 6);
      // (3) VIGNETTE last so it frames the brawl + darkens the pit rim, over the graded+bloomed image.
      // addVignette(x, y, radius, strength) — radius/strength in 0..1.
      cam.postFX.addVignette(0.5, 0.5, 0.72, 0.42);
      this._graded = true;
    }catch(e){ /* never break loadability over a cosmetic grade */ if(window.console) console.warn('camera grade skipped:', e && e.message); }
  }

  // --- SIDE-ON 1v1 GG STAGE (static shell): eye-level pit, warlock LEFT facing RIGHT, one opponent
  // staged RIGHT, the rest of the roster frozen as a hazy BACKGROUND lineup, magenta pit ring.
  // Source art faces: warlock/allies RIGHT, enemies LEFT — so foes need no flip to face the warlock. ---
  buildSideOn(){
    const W=this.scale.width, H=this.scale.height, gy=H*SIDEON_GROUND_FR;
    this._gy = gy;
    // --- PAINTED DRAGON'S-CROWN PARALLAX BACKDROP (Hiro FEEDBACK #6, RELAID per FEEDBACK #8) ---
    // The old layout cover-scaled ALL 3 layers over the full screen: the oblique bg_floor completely
    // COVERED the crowd wall (the whole backdrop "looked like a floor") and the fg pillars rode depth
    // 9000 IN FRONT of the fighters, blocking the action. New DC side-scroller banding:
    //   * bg_far  (crowd wall)   = UPPER band only — its wall base sits at the horizon line (wallY),
    //   * ground STRIP           = LOWER band only (wallY -> bottom), the plane the fighters stand on,
    //   * bg_fg   (edge pillars) = depth -96, BEHIND every actor (background columns, never over the action),
    // so the crowd is finally visible and nothing occludes the fighters. Parallax in syncSideOn().
    if(this.textures.exists('bg_far') && (this.textures.exists('bg_ground')||this.textures.exists('bg_floor'))){
      if(this.floorGfx) this.floorGfx.setVisible(false);      // hide the create() procedural angled floor
      const dims=tex=>{ const s=this.textures.get(tex).getSourceImage();
        return {w:(s&&s.width)||W, h:(s&&s.height)||H}; };
      this._bgCx=W/2;
      const wallY = gy - H*0.185;                             // horizon: wall base just behind the deepest actor row
      this._wallY = wallY;
      // FAR WALL: anchored by its BOTTOM edge on the horizon, covering the full width (x1.08 parallax
      // margin) — the crowd + banners fill the upper band; any ceiling overflow crops off the top.
      { const d=dims('bg_far'), s=Math.max(W*1.08/d.w, wallY/d.h);
        this.bgFar=this.add.image(W/2, wallY, 'bg_far').setOrigin(0.5,1).setDepth(-100).setScrollFactor(0).setScale(s); }
      // GROUND STRIP: fills ONLY the lower band (wallY -> screen bottom). Uniform width-cover scale,
      // vertically centered on the band so the detailed mid-region of the painting is what shows.
      { const gtex=this.textures.exists('bg_ground')?'bg_ground':'bg_floor';
        const d=dims(gtex), s=Math.max(W*1.02/d.w, (H-wallY)/d.h);
        this.bgFloor=this.add.image(W/2, wallY+(H-wallY)/2, gtex).setOrigin(0.5,0.5)
          .setDepth(-99).setScrollFactor(0).setScale(s); }
      // SEAM BLEND: a soft dark gradient where the wall meets the ground, so the two paintings read
      // as one scene instead of two stacked images.
      { const sg=this.add.graphics().setDepth(-98).setScrollFactor(0);
        sg.fillGradientStyle(0x0a0710,0x0a0710,0x0a0710,0x0a0710, 0.85,0.85,0,0);
        sg.fillRect(-W*0.1, wallY-6, W*1.2, H*0.055); }
      // EDGE PILLARS: widened outward (x1.30) so they hug the screen edges, and drawn BEHIND the
      // actors (depth -96) — they frame the stage but can never block the view of the fighters.
      if(this.textures.exists('bg_fg')){
        const d=dims('bg_fg'), s=Math.max(W/d.w, H/d.h);
        this.bgFg=this.add.image(W/2, H/2, 'bg_fg').setDepth(-96).setScrollFactor(0).setScale(s*1.30, s);
      }
    } else {
      // FALLBACK (backdrop art missing): the old procedural flat fills + magenta pit ring — keeps the
      // build loadable and vibe-checkable exactly as before.
      const bg=this.add.graphics().setDepth(2);
      bg.fillStyle(0x140d22,1).fillRect(0,0,W,gy*0.55);
      bg.fillStyle(0x1d1430,1).fillRect(0,gy*0.55,W,gy-gy*0.55);
      bg.fillStyle(0x0c0814,1).fillRect(0,gy,W,H-gy);
      bg.fillStyle(0x3a0d28,0.55).fillEllipse(W/2,gy+10,W*0.92,H*0.12);
      bg.lineStyle(6,0xff3aa0,0.9).strokeEllipse(W/2,gy+4,W*0.92,H*0.12);
      bg.lineStyle(2,0xff8ad0,0.5).strokeEllipse(W/2,gy+4,W*0.74,H*0.085);
      bg.fillStyle(0x05030a,0.6).fillRect(0,0,W,8);
    }
    // --- FLICKERING BRAZIER POINT-LIGHTS (Hiro FEEDBACK #6 part B-1): warm Light2D torches placed at the
    // painted brazier hotspots keyed into bg_fg (two flanking the pit on each edge). They throw live, jittering
    // torchlight ACROSS the warlock + foes as they move (the normal-mapped sprites already bake the response),
    // turning the static painted glow into real moving light — the highest-impact live-FX layer toward DC.
    // Each stores base x/y/intensity/radius + a phase; syncSideOn() flickers them + tracks the fg parallax.
    // Only built when bg_fg exists (the braziers are baked there); the fallback stage simply has no torches. ---
    this._brazLights=[];
    if(this.textures.exists('bg_fg')){
      const brazPos=[[0.035,0.76],[0.115,0.68],[0.965,0.74],[0.885,0.66]];   // [xFrac,yFrac] of the braziers — pillars now hug the edges (FEEDBACK #8 widen)
      brazPos.forEach(([fxr,fyr],i)=>{
        const L=this.lights.addLight(W*fxr, H*fyr, 300, 0xff7a30, 1.7);
        L._bx=W*fxr; L._by=H*fyr; L._bi=1.7; L._br=300; L._ph=i*1.9;          // base + per-torch flicker phase
        this._brazLights.push(L);
      });
    }
    // --- frozen BACKGROUND lineup of upcoming challengers (small, hazy, behind the duelists) ---
    // FEEDBACK #8 reposition: now the crowd wall is visible, the lineup stands AT THE WALL BASE —
    // spread wide along it, smaller and ghostlier, so it reads as challengers waiting at the back
    // of the pit instead of a dark clump in the middle of the fighting ground.
    this.lineupSprites=[];
    const lineup=['lich','demonlord','archdevil','clawfiend','bonedragon','succubus','archsuccubus','bonearcher'];
    lineup.forEach((key,i)=>{
      if(!this.textures.exists(key)) return;
      const x=W*0.50 + (i-(lineup.length-1)/2)*W*0.112;
      const s=this.add.sprite(x, gy-H*0.165, key).setOrigin(0.5,1).setPipeline('Light2D').setDepth(3);
      const wh=HERO_PX*(SPRITE_TARGET_H[key]||1)*0.34;            // distant => small
      s.setScale(wh/(s.height||wh)).setAlpha(0.34).setTint(0x8a8ab8);
      this.lineupSprites.push(s);
    });
    // --- CURRENT opponent: real side-on sprite anchored RIGHT, already facing LEFT (no flip) ---
    const foeKey=(enemies[0] && (enemies[0].spriteKey || foeKeyFor(enemies[0].name))) || 'shambler';
    if(this.textures.exists(foeKey)){
      const fx=W*0.72;
      this.foeShadow=this.add.image(fx,gy+6,'shadow').setAlpha(0.8).setDepth(gy-1);
      this.foeSprite=this.add.sprite(fx,gy,foeKey).setOrigin(0.5,1).setPipeline('Light2D').setDepth(gy);
      const fwh=HERO_PX*(SPRITE_TARGET_H[foeKey]||1);
      this.foeSprite.setScale(fwh/(this.foeSprite.height||fwh));
      this._foeScl=this.foeSprite.scaleX; this._foeKey=foeKey;   // base scale + base texture for the locomotion juice (FEEDBACK #8)
      this.foeShadow.setScale(Math.max(0.2,this.foeSprite.displayWidth/(this.foeShadow.width||1)*0.95));
      this.lights.addLight(fx, gy-160, 300, 0xff6a8a, 1.1);       // rim light on the foe side
    }
    // --- pin the WARLOCK to the LEFT third, facing RIGHT (eye-level duel anchor) ---
    P.x=W*0.30; P.y=gy; P.face=0;
    this.hero.setPosition(P.x,P.y); this.hero.setFlipX(false);
    if(this.keyLight){ this.keyLight.x=W*0.40; this.keyLight.y=gy-160; }
    this._foeName = (currentFoe()||{}).name || null;   // seed the duel tracker so frame 1 doesn't re-step
    this._foeStepping = false;                          // true only while a foe is collapsing/stepping in
    this._foeHomeX = W*0.72;                            // the foe's neutral standing x (returns here after a lunge)
    const f0=currentFoe(); if(f0){ f0.aiState='approach'; f0.aiCd=rnd(0.5,1.1); }
  }

  // --- DUEL LOOP (side-on, increment 1): bind the RIGHT-side foe sprite to currentFoe(). When the active
  // gauntlet foe changes (the prior one was SLAIN), the old sprite COLLAPSES (defeated leaves), the next
  // foe's sprite STEPS IN from the right, and the front of the background lineup advances (shrinks by one).
  // Per-frame it also reflects the live foe's hurt-flash + hex tint. No foe AI/approach yet (next run);
  // this makes the static tableau react to the duel the warlock is already winning via HEX/summons. ---
  syncSideOn(now){
    // PAINTED-BACKDROP PARALLAX (Hiro FEEDBACK #6, retuned #8): nudge the far + pillar layers opposite
    // the warlock's offset from centre so the pit gains depth as he walks — far crowd wall drifts least
    // (most distant), the edge pillars drift more (nearer mid-ground, but still BEHIND the actors).
    // The ground strip stays fixed: the fighters stand ON it, so sliding it would read as skating.
    if(this.bgFar){ const dx=(P.x-(this._bgCx||this.scale.width/2));
      this.bgFar.x=(this._bgCx||this.scale.width/2) - dx*0.05;
      const fgShift=-dx*0.11;
      if(this.bgFg) this.bgFg.x=(this._bgCx||this.scale.width/2) + fgShift;
      // FLICKER + parallax-track the brazier lights so the torchlight jitters and stays pinned to the
      // painted braziers as the fg layer drifts. Two stacked sines (a slow waver + a fast crackle) give a
      // living flame; intensity 0.78x-1.10x base, radius gently breathes with it. Render-only (no sim).
      if(this._brazLights && this._brazLights.length){ const t=(now||0)/1000;
        for(const L of this._brazLights){
          const f=0.78+0.20*Math.sin(t*6.5+L._ph)+0.10*Math.sin(t*21.7+L._ph*2.3);
          L.x=L._bx+fgShift; L.y=L._by;
          L.intensity=L._bi*f; L.radius=L._br*(0.90+0.16*f);
        }
      }
    }
    if(!this.foeSprite) return;
    const f=currentFoe();
    if(f && f.name!==this._foeName){
      // a NEW foe is up (the prior one was just SLAIN). FINISHER BEAT + camera WHIRL, then COLLAPSE the
      // old sprite and step the new one in. (priority-4 transition between fights.)
      this._foeName=f.name;
      this._foeStepping=true;                                      // freeze AI while the new foe walks on
      const W=this.scale.width, gy=this._gy, key=(f.spriteKey||foeKeyFor(f.name)), homeX=this._foeHomeX||W*0.72;
      f.aiState='approach'; f.aiCd=rnd(0.4,1.0);                   // fresh foe enters in approach
      this.finisherWhirl();                                        // flash+shake+banner + self-resetting cam punch
      // front of the lineup steps forward => remove one hazy challenger so the back row visibly shrinks
      if(this.lineupSprites && this.lineupSprites.length){
        const ls=this.lineupSprites.shift();
        if(ls) this.tweens.add({targets:ls, alpha:0, y:ls.y+18, duration:260, onComplete:()=>ls.destroy()});
      }
      const swapIn=()=>{
        if(!this.foeSprite || !this.textures.exists(key)){ this._foeStepping=false; return; }
        this.foeSprite.anims && this.foeSprite.anims.stop();
        this.foeSprite.setTexture(key);
        const fwh=HERO_PX*(SPRITE_TARGET_H[key]||1);
        this.foeSprite.setScale(fwh/(this.foeSprite.height||fwh)).clearTint().setAlpha(0);
        this.foeSprite.setRotation(0);
        this._foeScl=this.foeSprite.scaleX; this._foeKey=key;    // re-seed the locomotion base for the new body
        this.foeShadow.setScale(Math.max(0.2,this.foeSprite.displayWidth/(this.foeShadow.width||1)*0.95)).setAlpha(0);
        this.foeSprite.x=W*0.86; this.foeShadow.x=W*0.86;          // start off to the right, then walk in
        this.tweens.add({targets:[this.foeSprite], x:homeX, alpha:1, duration:360, ease:'Quad.out',
                         onComplete:()=>{ this._foeStepping=false; }});   // hand control to foeAI
        this.tweens.add({targets:[this.foeShadow], x:homeX, alpha:0.8, duration:360, ease:'Quad.out'});
      };
      // collapse the previous occupant (a SLAIN foe), then bring the next one in
      this.tweens.add({ targets:[this.foeSprite,this.foeShadow], alpha:0, duration:200,
                        onComplete:()=>swapIn() });
      return;
    }
    if(f){
      // drive the side-on foe AI (approach -> wind-up -> lunge -> recover); sets f._tele during the telegraph
      this.foeAI(now,f);
      this.foeMotion(now,f);   // FEEDBACK #8: stride bob + lean + squash/stretch + step dust (kills the glide)
      // live duel reactions (priority): white hurt-flash > yellow wind-up telegraph > magenta hex > natural rim
      if(f.flash>0)        this.foeSprite.setTint(0xffffff);
      else if(f._tele)     this.foeSprite.setTint(0xffd24a);
      else if(f.hexT>0)    this.foeSprite.setTint(0xc79bff);
      else                 this.foeSprite.clearTint();
    } else {
      // whole gauntlet cleared — fade the last foe out (a finisher beat lands in a later increment)
      if(this.foeSprite.alpha>0.02) this.foeSprite.setAlpha(Math.max(0,this.foeSprite.alpha-0.04));
    }
  }

  // --- FOE CROWD (priority-1/2, DC multi-foe wave): EVERY alive foe that ISN'T the current duel foe is
  // drawn as a real side-on sprite waiting in a shallow back depth band — deeper foes stand higher, smaller
  // and hazier — so a multi-foe wave LOOKS like a Dragon's Crown crowd instead of one duelist + invisible mob.
  // A per-foe {spr,shadow} pool keyed off the enemy object; culled when a foe dies or the wave swaps. A thin
  // HP pip floats over each. Render-only — reads e.x/e.flash/e.hexT/e.hp but never writes sim state. ---
  syncFoeCrowd(now){
    if(!SIDEON) return;
    const W=this.scale.width, H=this.scale.height, gy=this._gy||H*SIDEON_GROUND_FR;
    const cur=currentFoe();
    this._foeCrowd = this._foeCrowd || new Map();
    const pool=this._foeCrowd;
    if(!this._crowdGfx) this._crowdGfx=this.add.graphics();
    const cg=this._crowdGfx; cg.clear(); cg.setDepth(8000);
    // LUNGE-LANE decal layer: a faint ground oval marking the charger's COMMITTED strike window, drawn on the
    // floor BENEATH the units (depth 1, same band as zoneGfx) so the player can SEE where the charge will land
    // and step off. Render-only — cleared each frame, writes no sim state.
    if(!this._laneGfx) this._laneGfx=this.add.graphics();
    const lg=this._laneGfx; lg.clear(); lg.setDepth(1);
    // cull sprites whose foe died, left the wave, OR got promoted to the current duel foe (foeSprite owns it)
    for(const [e,o] of pool){ if(e.dead || e===cur || enemies.indexOf(e)<0){ if(o.shadow)o.shadow.destroy(); o.spr.destroy(); pool.delete(e); } }
    // gather the WAITING foes (alive, not the active duel foe currentFoe handles)
    const waiting=[]; for(const e of enemies){ if(!e.dead && e!==cur) waiting.push(e); }
    // DC CROWD LIGHT-AI: occasionally ONE back-row foe breaks formation, charges the player, throws a swing,
    // then rotates back to its slot. RENDER-ONLY (no sim/HP/damage written — the duel sim stays authoritative
    // and the build stays safe); a cosmetic pressure read so the wing feels alive instead of idly leaning.
    // MULTI-FOE CROWD PRESSURE (BRAWLER MIGRATION, step 1): up to _maxChargers back-row foes may break
    // formation AT ONCE, each driving its OWN commit-lock -> lunge -> sidestep-whiff -> lane-decal arc off a
    // per-foe SLOT object {foe,t0,struck,aimX,aimY}. Single-copy logic (the override below reads the slot, no
    // duplicated arc). Still RENDER-ONLY (no sim/HP authority); every landed chip routes through hurtWarlock
    // (i-frame-safe, HP FLOORED at 1) so two simultaneous pressers can never KO or softlock the warlock.
    this._chargers = this._chargers || [];
    this._maxChargers = 2;
    // cull finished/invalid slots (foe died, became the duel foe, or left the wave)
    this._chargers = this._chargers.filter(s => s.foe && !s.foe.dead && s.foe!==cur && enemies.indexOf(s.foe)>=0);
    if(this._chargers.length < this._maxChargers && waiting.length>=2 && now>(this._nextCharge||0)){
      // ROTATE across the wing: prefer foes that haven't charged this round AND aren't already charging, so
      // EVERY back-row foe takes a turn. The recent-set resets once everyone's gone -> a fresh rotation.
      const recent=this._recentChargers||(this._recentChargers=new Set());
      const busy=new Set(this._chargers.map(s=>s.foe));
      let fresh=[]; for(const e of waiting){ if(!recent.has(e) && !busy.has(e)) fresh.push(e); }
      if(!fresh.length){ recent.clear(); fresh=waiting.filter(e=>!busy.has(e)); }
      if(fresh.length){
        const pick=fresh[(Math.random()*fresh.length)|0];
        this._chargers.push({foe:pick, t0:now, struck:false, aimX:null, aimY:null});  // new slot, own lunge-commit lock
        recent.add(pick);
        // STAGGER the next break to 0.7-1.7s — deliberately UNDER the 1.4s arc so a 2nd presser usually joins
        // while the 1st is still mid-lunge (genuine two-at-once pressure), but offset so they don't perfectly
        // sync. Cap 2 + the 1.4s arc bound the rate to ~2 active with a brief breather, not a wall of charges.
        this._nextCharge=now + 700 + Math.random()*1000;
      }
    }
    waiting.forEach((e,i)=>{
      const key=e.spriteKey||foeKeyFor(e.name);
      if(!this.textures.exists(key)) return;
      let o=pool.get(e);
      if(!o || o.spr.texture.key!==key){
        if(o){ if(o.shadow)o.shadow.destroy(); o.spr.destroy(); }
        const spr=this.add.sprite(0,0,key).setOrigin(0.5,1).setPipeline('Light2D');
        const shadow=this.add.image(0,0,'shadow').setAlpha(0.45);
        o={spr,shadow}; pool.set(e,o);
      }
      const spr=o.spr, sh=o.shadow;
      // 2-row back formation, clamped on-screen; the deeper row sits higher + smaller (depth read)
      const row=i%2, col=Math.floor(i/2);
      const baseX=Math.min(W*0.96, W*(0.80 + 0.05*col + (row?0.025:0)));
      // DC CROWD PRESSURE: each waiting foe restlessly LEANS IN toward the player and rocks back, staggered by
      // a per-foe phase, so the back rows visibly press the brawl instead of standing frozen. Render-only and
      // bounded — x can never cross the standoff line (W*0.66) into the duel/player zone and it always eases
      // back, so the formation can't walk off; a small synced bob sells the shuffling step.
      const ph=now*0.0019 + i*0.85;
      const press=Math.sin(ph)*0.5+0.5;                          // 0..1 forward-lean cycle
      let dx=Math.max(W*0.66, baseX - press*W*0.07);             // default: restless lean, clamped at standoff
      const depthFrac=0.07 + (row?0.075:0) + 0.012*col;
      const fy=gy - H*depthFrac + Math.sin(ph*1.7)*H*0.009;      // restless vertical bob
      // CHARGE OVERRIDE: if this is the chosen charger, drive a windup -> lunge -> strike -> recover arc
      // toward the player and back. Bounded by the arc; auto-clears at t>=1 so it can never stick off-slot.
      let charging=false, hot=false;
      const slot = this._chargers ? this._chargers.find(s=>s.foe===e) : null;
      if(slot){
        charging=true;
        const t=Math.min(1,(now-(slot.t0||now))/1400);
        // LUNGE-COMMIT LOCK: at the windup->lunge boundary (t>=0.22) freeze the target spot ONCE from the
        // player's position THEN, and aim the whole arc at it. The old hitX re-read live P.x every frame, so
        // the charger rubber-banded onto the player (it could stick / re-aim mid-lunge). Committing to a fixed
        // point stops the stick AND lets a SIDESTEP off the committed lane avoid the swing (see the strike test).
        if(t>=0.22 && slot.aimX==null && typeof P!=='undefined' && P){
          slot.aimX=P.x; slot.aimY=P.y;                                            // committed player spot
        }
        const aimX=(slot.aimX!=null)?slot.aimX:((typeof P!=='undefined'&&P)?P.x:W*0.30);
        const homeX=baseX, hitX=aimX+48;                                            // stop just right of the COMMITTED spot
        if(t<0.22){ dx=homeX + W*0.03*(t/0.22); }                                   // windup: rear back
        else if(t<0.50){ const u=(t-0.22)/0.28, e2=1-(1-u)*(1-u); dx=homeX+W*0.03+(hitX-homeX-W*0.03)*e2; } // lunge in
        else if(t<0.62){ dx=hitX; hot=true; }                                       // strike at the committed spot
        else{ const u=(t-0.62)/0.38, e2=u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2; dx=hitX+(homeX-hitX)*e2; }      // recover
        if(t>=1){ this._chargers=this._chargers.filter(s=>s!==slot); }              // arc done -> free this slot
        // LUNGE-LANE TELEGRAPH: once the charge COMMITS (aim locked at t>=0.22) until the strike resolves
        // (t<0.62), paint a faint oval on the ground at the committed strike spot, sized to the EXACT dodge
        // window the strike test uses (|x-aimX|<56, |y-aimY|<34 -> 112x68 oval). It fills in as the lunge
        // closes, so the player can READ where to step off (left/right OR into depth). Render-only: drawn on
        // _laneGfx (depth 1, under feet); writes NO sim state — purely a visual reinforcement of the dodge.
        if(slot.aimX!=null && t<0.62){
          const lx=slot.aimX, ly=(slot.aimY!=null)?slot.aimY:fy;
          const u=Math.min(1,Math.max(0,(t-0.22)/0.28));            // 0->1 as the lunge closes toward the strike
          const pulse=0.5+0.5*Math.abs(Math.sin(now/55));
          lg.fillStyle(0xffd24a,(0.06+0.12*u)*pulse); lg.fillEllipse(lx,ly,112,68);                 // danger fill
          lg.lineStyle(2.5,0xffae3a,0.35+0.4*pulse);  lg.strokeEllipse(lx,ly,112,68);               // boundary ring
          lg.fillStyle(0xffffff,0.10*u);              lg.fillEllipse(lx,ly,112*(1-u*0.6),68*(1-u*0.6)); // closing core
        }
      }
      // STRIKE SPARK: one colored burst at the player the instant the charger lands its swing
      if(hot && slot && !slot.struck){
        slot.struck=true;
        // SIDESTEP DODGE: the swing lands at the COMMITTED spot (locked at lunge-commit above). If the warlock
        // has stepped off that spot on the shallow plane — in lane (x) OR depth (y) — the swing WHIFFS: grey dust
        // + MISS, no spark, no chip. So a clean sidestep now avoids the charge like a WARD/roll does; the connect
        // path (spark + i-frame-gated chip + recoil) only runs when the warlock is still inside the lane window.
        const _aimX=(slot.aimX!=null)?slot.aimX:((typeof P!=='undefined'&&P)?P.x:W*0.30);
        const _aimY=(slot.aimY!=null)?slot.aimY:fy;
        const _inLane=(typeof P!=='undefined'&&P)&&Math.abs(P.x-_aimX)<56&&Math.abs(P.y-_aimY)<34;
        if(_inLane){
        const tx=((typeof P!=='undefined'&&P)?P.x:W*0.30)+18, ty=fy-14;
        const tint=key.indexOf('dragon')>=0?0x7fd05a:(key.indexOf('succub')>=0?0xf06aa0:0xff6a7a);
        for(let k=0;k<6;k++){ const a=(k/6)*Math.PI*2+rnd(-0.3,0.3), d=rnd(20,46);
          const p=this.add.image(tx,ty,'glow').setBlendMode(Phaser.BlendModes.ADD).setTint(tint).setScale(rnd(0.10,0.20)).setDepth(9000);
          this.tweens.add({targets:p,x:tx+Math.cos(a)*d,y:ty+Math.sin(a)*d,alpha:0,scale:0.02,duration:rnd(240,420),ease:'Quad.out',onComplete:()=>p.destroy()}); }
        if(typeof S!=='undefined'&&S) S.shake=Math.max(S.shake||0,4);                // tiny pressure kick
        // SMALL REAL CHIP (teeth): the landed swing now bites. Routed through hurtWarlock so it OBEYS every
        // i-frame gate (ward/roll/blink-fade all negate it -> popup, no HP loss) and HP is FLOORED at 1 inside
        // hurtWarlock, so a back-row charge can never KO/softlock. Half a normal foe bite (~3-6), telegraphed by
        // the ~0.5s windup->lunge arc above, so a dodge or WARD during the wind cleanly avoids it.
        if(typeof hurtWarlock==='function' && typeof P!=='undefined' && P && !P.dead){
          const _hp0=P.hp;
          hurtWarlock(Math.max(2, Math.round(foeDmg(e)*0.5)));
          // HURT/RECOIL TELL (FEEDBACK #6 follow-up — make the chip READ as contact). Fires ONLY when the
          // chip actually CONNECTED: hurtWarlock leaves P.hp unchanged when WARD/roll/blink-fade negate the
          // hit, so `P.hp < _hp0` is exactly "it landed" — an i-frame'd hit produces NO knock/flash. The
          // knock shoves the warlock AWAY from the charger's lunge side and clampArena re-pins him inside the
          // pit ring (same shove+clamp pattern as the hurl at L920), so it can't desync or walk him off-arena.
          if(P.hp < _hp0){
            const kdir = (P.x <= dx) ? -1 : 1;                       // away from the charger (it lunges from the right -> knock left)
            P.x += kdir*18; this.clampArena(P);                      // small recoil step, re-clamped into the ring
            P.flash = Math.max(P.flash||0, 0.20);                    // a touch longer white/hurt-pose pop than the base chip's 0.14
            if(typeof S!=='undefined'&&S) S.shake=Math.max(S.shake||0,8);   // a firmer connect kick than the 4 windup spark
            const wfx=this.add.image(P.x, P.y-16, 'glow').setBlendMode(Phaser.BlendModes.ADD).setTint(0xffffff).setScale(0.24).setDepth(9001);
            this.tweens.add({targets:wfx, scale:0.04, alpha:0, duration:200, ease:'Quad.out', onComplete:()=>wfx.destroy()});
          }
        }
        } else {
          // WHIFF: the warlock sidestepped the committed lane — grey dust at the empty strike spot + MISS popup,
          // NO spark and NO chip (hurtWarlock is never called), so a clean sidestep fully negates the charge.
          const _mx=_aimX+18, _my=fy-14;
          for(let k=0;k<5;k++){ const a=rnd(0,Math.PI*2), d=rnd(10,26);
            const dp=this.add.image(_mx,_my,'glow').setBlendMode(Phaser.BlendModes.ADD).setTint(0x9a9aa6).setScale(rnd(0.06,0.12)).setDepth(8990);
            this.tweens.add({targets:dp,x:_mx+Math.cos(a)*d,y:_my+Math.sin(a)*d+8,alpha:0,scale:0.02,duration:rnd(200,340),ease:'Quad.out',onComplete:()=>dp.destroy()}); }
          if(typeof this.popup==='function') this.popup(_aimX, fy-30, 'MISS', '#9aa');
        }
      }
      const scl=Math.max(0.45, 0.82 - (row?0.10:0) - 0.02*col);
      const wh=HERO_PX*(SPRITE_TARGET_H[key]||1)*scl;
      spr.x=dx; spr.y=fy; spr.setScale(wh/(spr.height||wh)).setFlipX(false).setDepth(charging?fy+40:fy).setAlpha(0.9);
      // keyframe cycles for the wing too (anims.json): attack while charging, walk while pressing
      const cset = charging ? (this.animSets&&this.animSets[key+'_attack']) : (this.animSets&&this.animSets[key+'_walk']);
      if(cset){ const cur=spr.anims&&spr.anims.currentAnim;
        if(!cur||cur.key!==cset.key||!spr.anims.isPlaying) spr.play(cset.key,true); }
      else if(spr.anims && spr.anims.isPlaying){ spr.anims.stop(); if(this.textures.exists(key)) spr.setTexture(key); }
      // FEEDBACK #8 shuffle-step rock / committed charge lean — PHASE 1: procedural FALLBACK only,
      // zeroed while a real keyframe cycle is driving this wing sprite (one motion driver at a time).
      spr.setRotation(this.animDriving(spr) ? 0 : (charging ? -0.09 : Math.sin(ph*1.7)*0.028));
      if(e.flash>0)       spr.setTint(0xffffff);
      else if(charging)   spr.setTint(0xffd24a);                 // charger telegraphs HOT as it breaks formation
      else if(e._tele)    spr.setTint(0xffd24a);
      else if(e.hexT>0)   spr.setTint(0xc79bff);
      else                spr.setTint(0x8f8fa8);                 // hazy "waiting in the wings" desaturate
      sh.x=dx; sh.y=fy+5; sh.setDepth(fy-1).setScale(Math.max(0.18, spr.displayWidth/(sh.width||1)*0.85));
      // thin HP pip over each waiting foe (DC enemy health bar)
      const bw=Math.max(20, spr.displayWidth*0.7), bx=dx-bw/2, by=fy-spr.displayHeight-8;
      cg.fillStyle(0x000000,0.55); cg.fillRect(bx-1,by-1,bw+2,5);
      cg.fillStyle(0xff5a6a,1);    cg.fillRect(bx,by,bw*Math.max(0,e.hp/(e.maxhp||1)),3);
    });
  }

  // --- FINISHER BEAT + CAMERA WHIRL (priority-4): fired the instant the active gauntlet foe changes
  // (i.e. the prior one was slain). A white flash + screen-shake + "DOWN!" banner land the kill, then the
  // camera punches IN (zoom) and WHIPS toward the entry side as the next challenger steps up, settling back
  // to a centred eye-level frame. Every effect is self-resetting (zoomTo→1.0, pan→centre) so an interrupted
  // beat can't leave the camera stuck off-centre or zoomed — the build stays vibe-checkable. ---
  finisherWhirl(){
    const cam = this.cameras && this.cameras.main; if(!cam) return;
    const W=this.scale.width, H=this.scale.height;
    this.flash(0xffffff,0.16);                       // bright impact pop
    S.shake=Math.max(S.shake,13);                    // routed through update()'s cameras.main.shake
    S.hitPause=Math.max(S.hitPause,0.12);            // brief FULL FREEZE on the kill (GG hit-stop)
    S.slow=Math.max(S.slow,0.45);                    // then a short SLOW-MO as the next challenger enters
    this.finisherBurst();                            // radial spark pop + white flare on the slain foe
    this.banner('DOWN!','next challenger steps up','#ff6a8a');
    cam.zoomTo(1.14,170,'Quad.easeOut');             // punch in on the finish
    cam.pan(W*0.66,H*0.5,200,'Sine.easeInOut');      // whip toward the right where the next foe enters
    this.time.delayedCall(520, ()=>{                 // ...then settle back to the neutral centred frame
      const c=this.cameras && this.cameras.main; if(!c) return;
      c.zoomTo(1.0,360,'Quad.easeInOut');
      c.pan(W*0.5,H*0.5,360,'Sine.easeInOut');
    });
  }

  // --- FINISHER BURST (priority-4 polish): a radial spark pop + a quick white scale-flare on the SLAIN
  // foe's body. Called from finisherWhirl() BEFORE the collapse tween / texture swap, so this.foeSprite
  // still marks the kill spot. Particles ride Phaser's clock so they play over the hit-stop freeze. ---
  finisherBurst(){
    const s=this.foeSprite; if(!s) return;
    const bx=s.x, by=s.y-30;
    s.setTint(0xffffff);                                              // death flash on the body
    this.tweens.add({targets:s, scaleX:s.scaleX*1.12, scaleY:s.scaleY*1.12, yoyo:true, duration:90});
    for(let k=0;k<18;k++){ const a=(k/18)*Math.PI*2+rnd(-0.2,0.2), d=rnd(50,150);
      const p=this.add.image(bx,by,'glow').setBlendMode(Phaser.BlendModes.ADD)
        .setTint(0xff6a8a).setScale(rnd(0.12,0.24)).setDepth(9000);
      this.tweens.add({targets:p, x:bx+Math.cos(a)*d, y:by+Math.sin(a)*d,
        alpha:0, scale:0.03, duration:rnd(380,620), ease:'Quad.out', onComplete:()=>p.destroy()}); }
  }
  // TRANSFORM BEAT — radial spark + expanding ring on the warlock when his form swaps (arch devil /
  // lich / demon lord / revert). Render-only (rides Phaser's clock, self-destructing tweens); the form
  // colour matches the body tint so the morph reads at a glance. Called once per genuine form change.
  formMorphBurst(ft){
    const h=this.hero; if(!h) return;
    const bx=h.x, by=h.y-40;
    const col = ft==='archdevil'?0xff5a5a : ft==='demonlord'?0x9affc0 : ft==='lich'?0x8ad8ff : 0xffffff;
    // expanding shock ring
    const ring=this.add.image(bx,by,'glow').setBlendMode(Phaser.BlendModes.ADD)
      .setTint(col).setScale(0.1).setAlpha(0.95).setDepth(9001);
    this.tweens.add({targets:ring, scale:2.2, alpha:0, duration:380, ease:'Quad.out', onComplete:()=>ring.destroy()});
    // upward spark column (a "rising power" read for the borrowed form)
    for(let k=0;k<16;k++){ const a=rnd(-0.5,0.5)-Math.PI/2, d=rnd(60,150);
      const p=this.add.image(bx+rnd(-18,18),by,'glow').setBlendMode(Phaser.BlendModes.ADD)
        .setTint(col).setScale(rnd(0.10,0.20)).setDepth(9002);
      this.tweens.add({targets:p, x:p.x+Math.cos(a)*d, y:by+Math.sin(a)*d,
        alpha:0, scale:0.03, duration:rnd(340,560), ease:'Quad.out', onComplete:()=>p.destroy()}); }
    // brief white flash on the body itself + a pop of scale
    h.setTintFill && h.setTintFill(0xffffff);
    this.time.delayedCall(70, ()=>{ if(this.hero) this.hero.clearTint(); });
    this.tweens.add({targets:h, scaleX:h.scaleX*1.10, scaleY:h.scaleY*1.10, yoyo:true, duration:110});
    if(S) S.shake=Math.max(S.shake||0, 1.2);
  }

  // CHANNEL BEAT (fix #4) — a "gathering" telegraph on the warlock the instant the summon channel
  // begins: motes of power are PULLED INWARD to the caster + a violet caster glow, so the summon reads
  // as a deliberate build-up rather than an instant pop. Render-only (rides Phaser's clock). ---
  channelBeat(){
    const h=this.hero; if(!h) return;
    const bx=h.x, by=h.y-30, col=0x8a4cff;
    // soft caster glow that swells then fades under the warlock
    const g=this.add.image(bx,by,'glow').setBlendMode(Phaser.BlendModes.ADD)
      .setTint(col).setScale(0.2).setAlpha(0.0).setDepth(8400);
    this.tweens.add({targets:g, scale:1.1, alpha:0.5, duration:260, yoyo:true, ease:'Sine.inOut', onComplete:()=>g.destroy()});
    // motes converging INWARD onto the caster (the "gather")
    for(let k=0;k<14;k++){ const a=(k/14)*Math.PI*2+rnd(-0.2,0.2), d=rnd(70,130);
      const p=this.add.image(bx+Math.cos(a)*d, by+Math.sin(a)*d*0.7, 'glow').setBlendMode(Phaser.BlendModes.ADD)
        .setTint(col).setScale(rnd(0.06,0.14)).setAlpha(0).setDepth(8401);
      this.tweens.add({targets:p, x:bx, y:by, alpha:0.9, duration:rnd(260,420), ease:'Quad.in',
        onComplete:()=>{ this.tweens.add({targets:p, alpha:0, scale:0.02, duration:120, onComplete:()=>p.destroy()}); } }); }
  }

  // SPAWN BURST (fix #4) — fired at the exact point a summoned creature appears: a flat GROUND RUNE that
  // expands out from its feet + a quick vertical light flash + radial spark motes, tinted to the creature
  // family (claw=violet, dragon=green, coven=pink). Render-only, self-destructing tweens. ---
  spawnBurst(x,y,col){
    if(x==null) return; col=col||0xb070f0;
    // flat expanding ground rune (squished ellipse at the feet)
    const rune=this.add.image(x,y,'glow').setBlendMode(Phaser.BlendModes.ADD)
      .setTint(col).setScale(0.18,0.07).setAlpha(0.95).setDepth(8500);
    this.tweens.add({targets:rune, scaleX:1.9, scaleY:0.62, alpha:0, duration:440, ease:'Quad.out', onComplete:()=>rune.destroy()});
    // bright vertical flash where the body materialises
    const flash=this.add.image(x,y-26,'glow').setBlendMode(Phaser.BlendModes.ADD)
      .setTint(0xffffff).setScale(0.32,0.8).setAlpha(0.9).setDepth(8502);
    this.tweens.add({targets:flash, scaleX:0.04, scaleY:1.2, alpha:0, duration:300, ease:'Quad.out', onComplete:()=>flash.destroy()});
    // radial spark motes kicking up from the rune
    for(let k=0;k<14;k++){ const a=rnd(-0.6,0.6)-Math.PI/2, d=rnd(45,120);
      const p=this.add.image(x+rnd(-14,14),y,'glow').setBlendMode(Phaser.BlendModes.ADD)
        .setTint(col).setScale(rnd(0.08,0.18)).setDepth(8501);
      this.tweens.add({targets:p, x:p.x+Math.cos(a)*d, y:y+Math.sin(a)*d,
        alpha:0, scale:0.03, duration:rnd(320,520), ease:'Quad.out', onComplete:()=>p.destroy()}); }
    if(S) S.shake=Math.max(S.shake||0, 2.0);
  }

  // --- DUEL LOOP (side-on, increment 2): simple side-on foe AI. The current foe walks LEFT toward the
  // warlock to a melee spacing, telegraphs a WIND-UP (yellow tint, f._tele), LUNGES in (fast dash) and on
  // contact calls hurtWarlock() so HP trades both ways, then RECOVERS back to its home x. Stun/hex pause it.
  // Facing: enemy art already faces LEFT (toward the warlock on the left), so no flip needed. ---
  foeAI(now,f){
    if(this._foeStepping || !this.foeSprite) return;
    if(f.ranged){ this.foeRangedAI(now,f); return; }       // pyre/gunner: hold range + SHOOT, not melee-lunge
    const dt=this.dt||0.016, spr=this.foeSprite, sh=this.foeShadow;
    const homeX=this._foeHomeX||this.scale.width*0.72;
    const meleeX=P.x+88;                                   // standing distance for the wind-up
    if(f.stunT>0){ f._tele=false; return; }                // PORTAL stun freezes the foe
    f.aiState=f.aiState||'approach'; f.aiCd=Math.max(0,(f.aiCd||0)-dt); f._tele=false;
    switch(f.aiState){
      case 'approach':
        spr.x = Math.max(meleeX, spr.x - 72*dt);             // walk in ~72 px/s toward melee spacing
        if(spr.x<=meleeX+2 && f.aiCd<=0){ f.aiState='windup'; f.windT=0.55; }   // Hiro 2026-07-09: slower, readable telegraphs (was .34)
        break;
      case 'windup':
        f._tele=true; f.windT-=dt;
        spr.x=Math.min(homeX, spr.x+38*dt);                 // small lean back as it loads the lunge
        if(f.windT<=0){ f.aiState='lunge'; f.lungeT=0.20; f._hit=false; }
        break;
      case 'lunge':
        f.lungeT-=dt;
        spr.x=Math.max(P.x+40, spr.x-360*dt);               // fast dash in, clamped just short of the warlock
        if(!f._hit && spr.x<=P.x+62){ f._hit=true; hurtWarlock(foeDmg(f)); }
        if(f.lungeT<=0){ f.aiState='recover'; f.recT=0.45; }
        break;
      case 'recover':
        f.recT-=dt;
        spr.x=Math.min(homeX, spr.x+140*dt);                // back-pedal to neutral
        if(f.recT<=0){ f.aiState='approach'; f.aiCd=rnd(1.1,2.2); }   // Hiro 2026-07-09: longer breather between swings (was .6-1.4)
        break;
    }
    sh.x=spr.x;                                             // shadow tracks the body
  }
  // --- RANGED FOE AI (per-type, pit.js pyre/gunner): the foe REFUSES melee — it holds a long standoff,
  // telegraphs a wind-up (yellow _tele), then FIRES a foeShots[] projectile at the warlock and reloads.
  // Keeps distance from either side so the player must close or dodge the shot (DC ranged-pressure read). ---
  foeRangedAI(now,f){
    const dt=this.dt||0.016, spr=this.foeSprite, sh=this.foeShadow;
    const homeX=this._foeHomeX||this.scale.width*0.72;
    const standX=Math.min(homeX, P.x+300);                 // ranged standoff — hold the line, don't close
    if(f.stunT>0){ f._tele=false; return; }                // PORTAL stun freezes the foe
    f.aiState=f.aiState||'approach'; f.aiCd=Math.max(0,(f.aiCd||0)-dt); f._tele=false;
    switch(f.aiState){
      case 'approach':                                      // keep range: drift toward the standoff x from either side
        if(spr.x < standX-4)      spr.x=Math.min(standX, spr.x+60*dt);
        else if(spr.x > standX+4) spr.x=Math.max(standX, spr.x-60*dt);
        if(Math.abs(spr.x-standX)<6 && f.aiCd<=0){ f.aiState='windup'; f.windT=0.70; }   // Hiro 2026-07-09: slower draw/aim (was .45)
        break;
      case 'windup':
        f._tele=true; f.windT-=dt;
        spr.x=Math.min(homeX, spr.x+24*dt);                 // small brace back as it draws/aims
        if(f.windT<=0){ this.foeShoot(f,spr); f.aiState='recover'; f.recT=rnd(1.3,2.1); }   // Hiro 2026-07-09: slower volleys (was .9-1.5)
        break;
      case 'recover':
        f.recT-=dt;
        if(f.recT<=0){ f.aiState='approach'; f.aiCd=rnd(0.9,1.7); }   // (was .5-1.1)
        break;
    }
    sh.x=spr.x;
  }
  foeShoot(f,spr){                                          // spawn one enemy projectile aimed at the warlock
    const sx=spr.x, sy=((spr.y!=null)?spr.y:P.y)-20;
    const a=Math.atan2((P.y-18)-sy, P.x-sx), sp=320;
    const fire=(f.type==='pyre');
    foeShots.push({ x:sx, y:sy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, r:7,
      dmg:foeDmg(f)+2, fire, col:(fire?'#f0883d':'#ffd24a') });
    this.flash && this.flash(fire?0xff8040:0xfff0a0, 0.05);
    if(typeof S!=='undefined'&&S) S.shake=Math.max(S.shake||0,3);
  }
  // --- PROCEDURAL FOE LOCOMOTION (FEEDBACK #8 "walking, not gliding"): render-only motion layered on
  // the duel foe every frame. A per-foe stride clock advances by the distance the AI ACTUALLY moved the
  // sprite, driving a footfall bob + shoulder rock + step dust while walking; wind-up coils the body back
  // and tall, the lunge SQUASH-STRETCHES into the dash, hurt tilts it away. Rotation pivots at the feet
  // (origin 0.5,1) so every lean reads as body language, and y only ever offsets UP — no floor clipping.
  // If anims.json has ingested keyframe cycles for this foe (<foe>_walk / <foe>_attack) they play instead
  // of the still; the procedural layer rides on top either way. Writes NO sim state (f._stride/_lx/_lb
  // are render-scratch, same class as f._tele). ---
  // PHASE 1 (ANIM_COMBAT_OVERHAUL): ONE motion driver per actor. TRUE while a REAL ingested keyframe
  // cycle (anims.json set, key 'anim_*') is actively playing on this sprite — the procedural
  // bob/lean/squash-stretch layers below must stand down then, so the flipbook is the single visible
  // cause of motion. Procedural stays as the FALLBACK for actors still on a single still texture.
  animDriving(spr){
    const a=spr&&spr.anims;
    return !!(a && a.isPlaying && a.currentAnim && a.currentAnim.key.indexOf('anim_')===0);
  }
  foeMotion(now,f){
    const spr=this.foeSprite, sh=this.foeShadow; if(!spr) return;
    const gy=this._gy||spr.y, dt=this.dt||0.016;
    // base scale computed LIVE from the current texture height (world-height contract): keyframe
    // cycles swap textures with slightly different px dims per frame — a frozen base would jitter.
    const bkey=this._foeKey||spr.texture.key;
    const base=(HERO_PX*(SPRITE_TARGET_H[bkey]||1))/(spr.height||1);
    const mv=Math.abs(spr.x-(f._lx!=null?f._lx:spr.x))/Math.max(dt,1e-4);   // px/s the AI actually moved it
    f._lx=spr.x;
    f._stride=(f._stride||0) + dt*Math.min(3.0, mv/72)*Math.PI*2;           // stride rate follows true ground speed
    const st=f.aiState;
    // KEYFRAME CYCLES (anims.json manifest) — selected FIRST so the procedural layer knows to stand
    // down (PHASE 1: one motion driver per action — flipbook OR procedural sway, never both stacked).
    const bk=this._foeKey||spr.texture.key;
    // full sheet coverage (2026-07-09 enemy sheets): hurt interrupts, attack on the lunge,
    // walk while moving, IDLE set at rest — the still texture is now the last resort only.
    const wantSet = f.flash>0.04   ? (this.animSets&&this.animSets[bk+'_hurt'])
                  : st==='lunge'   ? (this.animSets&&this.animSets[bk+'_attack'])
                  : st==='windup'  ? (this.animSets&&this.animSets[bk+'_attack'])
                  : (mv>8          ? (this.animSets&&this.animSets[bk+'_walk'])
                                   : (this.animSets&&this.animSets[bk+'_idle']));
    if(wantSet){ const cur=spr.anims&&spr.anims.currentAnim;
      if(!cur||cur.key!==wantSet.key||!spr.anims.isPlaying) spr.play(wantSet.key,true);
    } else if(spr.anims && spr.anims.isPlaying){ spr.anims.stop(); if(this.textures.exists(bk)) spr.setTexture(bk); }
    const animOn=this.animDriving(spr);
    let bob=0, rot=0, sx=1, sy=1;
    if(!animOn){                                                             // PROCEDURAL layer = FALLBACK only (stills)
      if(st==='windup'){ rot=0.085; sx=0.965; sy=1.04; }                     // coil: rear back + rise tall
      else if(st==='lunge'){ rot=-0.10; sx=1.15; sy=0.92; }                  // stretch INTO the dash
      else if(mv>8){
        bob=-Math.abs(Math.sin(f._stride))*5;                                // footfall bounce (up only)
        rot=(spr.x>P.x?-1:1)*0.030 + Math.sin(f._stride*2)*0.018;            // lean toward the warlock + step rock
      } else { sy=1+0.010*Math.sin((now||0)/430); }                          // idle breathing (scale, feet planted)
      if(f.flash>0) rot+=0.10;                                               // hurt: recoil tilt
    }

    if(mv>8){

  aimAngle(){ return Math.atan2(this.mouse.y-P.y, this.mouse.x-P.x); }

  // ---- HEX (real): cast flash at the staff; the bolt itself is a real fireballs[] entry ----
  fxHexCast(face){

  // Brief CAST-pose swap: show warlock_cast (normal-mapped, Light2D-lit) ~0.35s on HEX, then revert.
  // Guarded so it can't break the build if the cast texture failed to load; cancels a prior swap.
  // ABILITY-SHEET ONE-SHOTS (2026-07-07, post-2B.5-approval): play a sheet-sourced action set
  // (warlock_hex / warlock_portal / ...) ONCE on the hero, then revert to the form body. Same
  // ownership contract as castPose: while _castTimer runs, the main driver leaves the sprite
  // alone, and Phase-1 gating silences procedural motion because a real anim is playing.
  // Returns false when the set isn't available so callers can fall back. Duration follows the
  // set's real frame count (no more cutting the last frames off with a fixed 350ms).
  // low-level: play ANY registered anim key once on the hero with castTimer ownership, then
  // revert to the form body. Duration follows the anim's real frame count and rate.
  heroPlayOnce(key){
    if(!this.hero || !this.anims.exists(key)) return false;
    if(this._castTimer){ this._castTimer.remove(false); this._castTimer=null; }
    const an=this.anims.get(key);
    this.hero.play({key:key, repeat:0});
    this._castTimer=this.time.delayedCall(Math.ceil(1000*an.frames.length/(an.frameRate||10))+60, ()=>{
      this._castTimer=null;
      if(!this.hero) return;
      // Hiro bug 2026-07-09 "still seeing the warlock old sprite sometimes": reverting to the STATIC
      // form still flashed the pre-sheet idle art for a frame (or longer mid-channel). Land directly
      // in the form's IDLE SET when one exists — the main driver takes over seamlessly next frame.
      const idleSet=this.animSets && this.animSets[heroFormTex()+'_idle'];
      if(idleSet){ this.hero.play(idleSet.key, true); return; }
      let back=heroFormTex();
      if(!this.textures.exists(back)) back=this.textures.exists('warlock')?'warlock':'warlock_f0';
      this.hero.anims && this.hero.anims.stop();
      this.hero.setTexture(back);
    });

  }
  heroOneShot(act){
    if(RIG_PLAY && this.warlockRig && heroFormTex()==='warlock') return false;  // rig mode owns poses
    const st=this.animSets && this.animSets['warlock_'+act];
    if(!st) return false;
    return this.heroPlayOnce(st.key);

  castPose(){
    // PHASE 2B.4: with the cutout rig driving the Warlock, the HEX cast beat plays the rig's
    // one-shot ATTACK template (anticipation -> impact freeze -> eased recovery) instead of the
    // old texture swap. Falls through to the flipbook path when the rig is off/failed/transformed.
    if(RIG_PLAY && this.warlockRig && heroFormTex()==='warlock'){ this.rigPlay('attack'); return; }
    // ABILITY SHEET: the HEX cast prefers the sheet-sourced warlock_hex set (8 frames)...
    if(this.heroOneShot('hex')) return;
    // ...and only falls back to the old single warlock_cast still if the set isn't loaded yet.
    if(!this.hero || !this.textures.exists('warlock_cast')) return;
    if(this._castTimer){ this._castTimer.remove(false); this._castTimer=null; }
    this.hero.anims && this.hero.anims.stop();
    this.hero.setTexture('warlock_cast');
    this._castTimer = this.time.delayedCall(350, ()=>{
      this._castTimer=null;
      if(!this.hero) return;
      // revert to the CURRENT FORM body (arch devil / lich / demon lord), not always the warlock,
      // so casting a HEX mid-transformation doesn't snap him back to the plain warlock sprite.
      let back = heroFormTex();
      if(!this.textures.exists(back)) back = this.textures.exists('warlock') ? 'warlock' : 'warlock_f0';
      this.hero.setTexture(back);
      if(back==='warlock' && this.anims.exists('warlock_idle')) this.hero.play('warlock_idle');

  flash(color,dur){ this.cameras.main.flash(dur*1000, (color>>16)&255,(color>>8)&255,color&255); }

  // --- ATMOSPHERIC PARTICLE LAYER (DC "living pit", FEEDBACK toward ~88% LOOK) — the highest-leverage push
  // now the grade has landed: a static-but-graded frame reads as a SCREENSHOT; DC pits constantly BREATHE.
  // Three render-only layers, behind the actors (depth -50/-49: over the painted backdrop at -100/-99, under
  // every depth>=0 actor/FX): (1) slow raking GOD-RAY shafts, (2) rising warm EMBERS, (3) cool drifting DUST.
  // Self-managed pool of 'glow' images recycled on Phaser's clock + real delta (alive through hit-stop). It
  // writes NO sim/combat/targeting state and is guarded by the 'glow' texture so the build stays loadable. ---
  buildAtmosphere(){
    if(!this.textures.exists('glow')) return;
    const W=this.scale.width, H=this.scale.height;
    this._atmoW=W; this._atmoH=H;
    // (1) GOD-RAY shafts: tall soft columns raking down from the upper-right, very low alpha, each slowly
    // breathing out of phase so the shafts shimmer like dusty light through the amphitheater rim.
    this._rays=[];
    for(let i=0;i<4;i++){
      const r=this.add.image(W*(0.26+0.18*i), H*0.06, 'glow')
        .setBlendMode(Phaser.BlendModes.ADD).setTint(0xffe6b0)
        .setOrigin(0.5,0).setScrollFactor(0).setDepth(-50);
      r.setAngle(18).setScale(0.95,7.6);
      r._a0=0.05+0.03*Math.random(); r._ph=i*1.7; r.setAlpha(r._a0);
      this._rays.push(r);
    }
    // (2)+(3) EMBER/DUST motes: warm embers rise briskly; every 4th is a slower, cooler dust speck.
    this._embersArr=[];
    for(let i=0;i<34;i++){
      const dust=(i%4===0);
      const m=this.add.image(0,0,'glow')
        .setBlendMode(Phaser.BlendModes.ADD).setScrollFactor(0).setDepth(-49)
        .setTint(dust?0x9ab0d0:(Math.random()<0.5?0xff9a40:0xffd060));
      this._initMote(m,dust,true);
      this._embersArr.push(m);
    }
    this._embers=true;   // flips the __AUDIT__ embers flag true (auditor was scoring it FAIL)
  }
  _initMote(m,dust,anywhere){
    const W=this._atmoW||this.scale.width, H=this._atmoH||this.scale.height;
    m._dust=dust;
    m.x=Math.random()*W; m._x0=m.x;
    m.y=anywhere?Math.random()*H:(H+10);
    m._vy=dust?-(6+Math.random()*10):-(18+Math.random()*30);   // px/s upward
    m._sway=0.4+Math.random()*1.1; m._swA=8+Math.random()*22; m._ph=Math.random()*6.283;
    m._s=dust?(0.03+Math.random()*0.04):(0.04+Math.random()*0.06);
    m._a=dust?(0.10+Math.random()*0.10):(0.22+Math.random()*0.28);
    m.setScale(m._s).setAlpha(0);
  }
  stepAtmosphere(now,dt){
    if(!this._embers) return;
    const H=this._atmoH||this.scale.height, t=(now||0)/1000;
    if(this._rays) for(const r of this._rays) r.setAlpha(r._a0*(0.6+0.4*Math.sin(t*0.6+r._ph)));
    if(this._embersArr) for(const m of this._embersArr){
      m.y += m._vy*dt;
      m.x  = m._x0 + Math.sin(t*m._sway+m._ph)*m._swA;
      const fy=Phaser.Math.Clamp(m.y/H,0,1);                    // 1 at the floor, 0 at the rim
      const fade=Math.min(1,fy*2)*Math.min(1,(1-fy)*3+0.15);    // fade in off the floor, out toward the top
      m.setAlpha(m._a*fade);
      if(m.y<-10) this._initMote(m,m._dust,false);              // recycle at the bottom
    }
  }

  update(now){
    const rdt = Math.min(0.05, (now-this.last)/1000); this.last=now;
    // HIT-STOP / SLOW-MO (GG finisher feel, priority-4 polish): S.hitPause fully FREEZES the sim for a
    // beat on a kill, then S.slow runs it at 35% for a short slow-mo before resuming. Both tick down in
    // REAL time (rdt) so the freeze can never get stuck; camera shake/tweens use Phaser's own clock and
    // are unaffected, so the finisher whirl still plays over the frozen fighters.
    let dt = rdt;
    if(S.hitPause>0){ S.hitPause=Math.max(0,S.hitPause-rdt); dt=0; }
    else if(S.slow>0){ S.slow=Math.max(0,S.slow-rdt); dt=rdt*0.35; }
    this.dt = dt;                                // expose (scaled) dt to side-on foe AI (syncSideOn/foeAI)
    frame(dt);                                   // advance the pit.js-shaped state
    if(S.shake>0){ this.cameras.main.shake(120, 0.004*S.shake); S.shake=0; }  // pit.js screen shake
    // reflect state -> sprites
    this.hero.x=P.x; this.hero.y=P.y; this.hero.setFlipX(Math.cos(P.face)<0);
    // GROUND-CONTACT FIX (FEEDBACK #8): origin is at the FEET (0.5,1) and P.y IS the ground line, so the
    // contact shadow belongs right under the feet — the old +86 hung it well below the floor in side-on.
    this.shadow.x=P.x; this.shadow.y=SIDEON ? P.y+4 : P.y+86;
    // depth by y (y-sort) + slight scale for distance (the 2.5D ground feel)
    const b=this.bounds, ty=Phaser.Math.Clamp((P.y-b.cyTop)/(b.cyBot-b.cyTop),0,1);
    const sc=Phaser.Math.Linear(0.78,1.0,ty);
    // SCALE-FIX (Hiro #1): size the hero by its TARGET WORLD HEIGHT, not the source PNG dims.
    // displayScale = (HERO_PX * SPRITE_TARGET_H[formKey]) / tex.height, then × perspective scale (sc).
    // The form key (warlock/lich/archdevil/demonlord) drives the world target so the borrowed forms
    // still read bigger; dividing by the LIVE texture height normalizes absolute size (fixes "huge warlock").
    const heroKey=P.demonLord?'demonlord':(P.devilT>0?'archdevil':(P.lich?'lich':'warlock_idle'));
    const heroWorldH=HERO_PX*(SPRITE_TARGET_H[heroKey]||1.0);
    // FORM SWAP (transformations, side-on): show the actual borrowed-form sprite — arch devil / lich /
    // demon lord — not just a tinted+scaled warlock. Re-asserts each frame so it survives a cast-pose
    // revert and any form change; skipped while the brief CAST pose is showing (castPose owns it then).
    // --- STRIDE CLOCK (FEEDBACK #8 "walking, not gliding"): a phase that only advances WHILE moving,
    // tied to walk speed (210 px/s, ~2.2 steps/s), so every footfall cue below (bounce, pose alternation,
    // lean, dust) stays locked to actual ground covered — stopping mid-step freezes the cycle naturally.
    this._stride=(this._stride||0); this._heroDir=(P.x>=(this._lastPX!=null?this._lastPX:P.x))?1:-1;
    if(P.moving) this._stride += dt*2.2*Math.PI*2;
    this._lastPX=P.x;
    // --- PHASE 2B.4 (ANIM_COMBAT_OVERHAUL): CUTOUT-RIG PLAYBACK, Warlock only. Active when the
    // RIG_PLAY flag is on, the rig built, and the BASE form owns the body (transformations keep
    // their flipbook bodies until the pilot is approved). When active: the flipbook hero sprite
    // hides, the rig root takes his position/facing/scale/depth, locomotion picks walk/idle from
    // the sim, and the SCALED dt drives the clock so hit-stop freezes the rig like everything
    // else. The one-shot ATTACK template (triggered from castPose) finishes before locomotion
    // reclaims the clock. ?rig=0 or a failed build -> this whole block no-ops and the Phase-2
    // flipbook path below runs untouched.
    const rigOn = RIG_PLAY && this.warlockRig && heroFormTex()==='warlock';
    if(rigOn){
      const R=this.warlockRig;
      this.hero.setVisible(false); R.root.setVisible(true);
      const cur=R.data.actions[this._rigAction];
      const oneShotLive = cur && !cur.loop && this._rigT < cur.dur;
      if(!oneShotLive) this.rigPlay(P.moving ? 'walk' : 'idle');
      this.rigUpdate(dt);
      const rscl=(sc*heroWorldH)/(R.data.nominalH||460);
      const fl=Math.cos(P.face)<0?-1:1;
      R.root.setScale(rscl*fl, rscl);
      R.root.x=P.x + (this._rigRootDX||0)*rscl*fl;
      R.root.y=P.y;
      R.root.setDepth(P.y);
      for(const nm in R.nodes){ const s=R.nodes[nm]._sprite; if(!s) continue;   // hurt flash parity
        if(P.flash>0) s.setTint(0xff5a5a); else s.clearTint(); }
    } else {
      if(this.warlockRig) this.warlockRig.root.setVisible(false);
      this.hero.setVisible(true);
    }
    if(!rigOn && !this._castTimer){
      // FORM IDENTITY (transformation-aware) vs POSE (state animation). The base warlock now swaps
      // among idle/walk/hurt by STATE (fix #3); the borrowed forms (lich/archdevil/demonlord) have
      // one body each, so their pose IS their form. Cast pose is owned by castPose (guarded above).
      const baseForm=heroFormTex();
      // ACTION is form-agnostic (lich/archdevil/demonlord walk + hurt too) so keyframe sets can key
      // <form>_<act>; only the STILL fallback differs (borrowed forms have one body, warlock has poses).
      let act = P.flash>0 ? 'hurt' : (P.channel ? 'summon' : (P.moving ? 'walk' : 'idle'));
      let ft=baseForm;
      if(baseForm==='warlock'){
        ft  = P.flash>0 ? 'warlock_hurt' : (P.channel ? 'warlock_summon' : (P.moving ? 'warlock_walk' : 'warlock'));
        // 2-POSE STEP CYCLE (fallback while true keyframe sets are pending): alternate stride-pose <->
        // standing-pose on each FOOTFALL beat of the stride clock, so walking reads as stepping even
        // with only the two stills we have today. A real anims.json walk set overrides this below.
        if(P.moving && !(this.animSets&&this.animSets['warlock_walk']) && this.textures.exists('warlock_walk'))
          ft = (Math.sin(this._stride)>=0) ? 'warlock_walk' : 'warlock';
      }
      const prevAct=this._heroAct;
      this._heroAct=act;
      // HURT ONE-SHOT (sheet row 2026-07-08): a hit plays the full recoil→stagger→recover arc ONCE
      // — P.flash alone (~0.2s) is shorter than the 6-frame arc, so looping the set would cut it
      // mid-stagger. Checked FIRST so a hit also visibly interrupts a summon channel (the intro
      // replays when the channel resumes — reads as the incantation being knocked out of his hands).
      if(baseForm==='warlock' && act==='hurt' && prevAct!=='hurt'
         && this.animSets && this.animSets['warlock_hurt']
         && this.heroPlayOnce(this.animSets['warlock_hurt'].key)){
        /* hurt arc owns this beat */
      } else
      // PHASED SUMMON — RELEASE (Hiro 2026-07-07): leaving the channel resolves with 6-7-8 played
      // ONCE (heroPlayOnce's castTimer owns the sprite for its duration, so nothing below stomps it).
      if(baseForm==='warlock' && prevAct==='summon' && act!=='summon'
         && this.anims.exists('anim_warlock_summon_out') && this.heroPlayOnce('anim_warlock_summon_out')){
        /* outro owns this beat */
      } else
      // PHASED SUMMON — ENTER + HOLD: cast start plays intro 1-2-3-4-5 once, chained into the slow
      // 5-6 pulse for as long as the channel holds (re-enters the pulse after an interruption).
      if(baseForm==='warlock' && act==='summon' && this.anims.exists('anim_warlock_summon_in')){
        if(prevAct!=='summon'){
          this.hero.anims && this.hero.anims.stop();
          this.hero.play('anim_warlock_summon_in');
          this.hero.chain('anim_warlock_summon_loop');
        } else if(!(this.hero.anims && this.hero.anims.isPlaying)){
          this.hero.play('anim_warlock_summon_loop');
        }
      } else {
      // REAL KEYFRAME CYCLE (anims.json manifest): if an ingested multi-frame set exists for this
      // form+action, play it (Light2D-lit frames); otherwise fall back to the still/2-pose swap.
      // Borrowed forms (lich/archdevil/demonlord) key their own sets: <form>_<act> (e.g. lich_idle).
      const set=this.animSets && this.animSets[(baseForm==='warlock'?'warlock':baseForm)+'_'+act];
      if(set){
        const cur=this.hero.anims && this.hero.anims.currentAnim;
        if(!cur || cur.key!==set.key || !this.hero.anims.isPlaying) this.hero.play(set.key, true);
      } else if(this.textures.exists(ft) && this.hero.texture.key!==ft){
        this.hero.anims && this.hero.anims.stop();
        this.hero.setTexture(ft);
        if(ft==='warlock' && this.anims.exists('warlock_idle')) this.hero.play('warlock_idle');
      }

      advSay('7f80e8d4','MARLOW','"Dren? Last champion before you. Left his winnings in my strongbox and his boots under the bed..."',
        ()=>advSay('0af883b8','THE WARLOCK','"Dead men leave echoes. His is still warm in this room — speak."'));
      ADV.quest=1; ADV.objective='FIND DREN — EAST, THE PIT';
    } else if(ADV.quest>=4){
      advSay('d29687a3','MARLOW','"Watch the alleys, champion. Whatever shops for the gifted hasn\'t finished its list."');
      ADV.quest=5; ADV.objective='KARRIDGE SLEEPS EASIER';
      scene && scene.banner('QUEST COMPLETE','THE MISSING CHAMPION — gold '+ADV.gold+' · relic: DREN\'S BOOTS','#3df0c8');
    } else if(ADV.gold>=25){ ADV.gold-=25; ADV.potions++;
      advSay('0d05c46c','THE WARLOCK','potion bought — "Five silver. Cheaper than the other ways I ask questions."');
    } else { advSay('a0196e98','MARLOW','"Five silver. The Pit paid you a silver a head — don\'t tell me you\'re short."'); }
    return;
  }
  if(n.key==='npc_smith'){
    if(!ADV._smithGift){ ADV._smithGift=true; ADV.potions++;
      showBanner('HARROW THE SMITH','"For the pit-bound — no charge. Bring me pit-iron and we\'ll talk edges."','#e7d9b0');
      scene && scene.popup(P.x,P.y-70,'POTION','#7fd05a'); }
    else showBanner('HARROW THE SMITH','"Still breathing? Then the work holds."','#e7d9b0');
    return;
  }
  if(n.key==='npc_priest'){
    P.hp=maxHP(); flashFx(0.15);
    showBanner('FATHER OSSU', ADV.quest>=3 ? '"The pit gave one back. The chapel remembers." — HEALED'
                                           : '"Go quietly, or go blessed." — HEALED','#9af0c0');
    return;
  }
}
function advFrame(dt){
  const sc=scene; if(!sc) return;
  const W=sc.scale.width, H=sc.scale.height, gy=H*SIDEON_GROUND_FR, A=ADV_AREAS[ADV.mode];
  let mx=0;
  if(keys['a']||keys['arrowleft'])  mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;
  if(stick.on) mx+=stick.dx;
  P.moving=false;
  if(mx && P.rollT<=0 && P.paralyzeT<=0){
    P.x+=Math.sign(mx)*advSpeed()*dt; P.moving=true; P.face=(mx>0)?0:Math.PI;
  }
  // DC push-scroll: the warlock shoves the camera window through the world
  if(P.x>W*0.60 && ADV.camX<A.len-W){ ADV.camX=Math.min(A.len-W, ADV.camX+(P.x-W*0.60)); P.x=W*0.60; }
  if(P.x<W*0.34 && ADV.camX>0)      { ADV.camX=Math.max(0,       ADV.camX-(W*0.34-P.x)); P.x=W*0.34; }
  P.x=Math.max(36, Math.min(W-36, P.x)); P.y=gy;
  // world-edge transitions (walking, not menus)
  const wx=ADV.camX+P.x;
  if(ADV.mode==='village' && wx>=A.len-46) advGoto('road', 90);
  if(ADV.mode==='road'    && wx<=44)       advGoto('village', -1);
  // parallax: far drifts least, buildings mid, ground 1:1, near-plane fastest (in FRONT of the actors)
  const L=ADV._layers;
  if(L){ if(L.far.visible)  L.far.tilePositionX  = ADV.camX*0.22/(L.far._ps||1);
         if(L.gnd.visible)  L.gnd.tilePositionX  = ADV.camX*1.00/(L.gnd._ps||1);
         if(L.mid.visible)  L.mid.tilePositionX  = ADV.camX*0.55/(L.mid._ps||1);
         if(L.near.visible) L.near.tilePositionX = ADV.camX*1.35/(L.near._ps||1); }
  // NPCs hold their WORLD posts; sprites slide with the camera window
  for(const n of ADV._npcs){
    const vis=(ADV.mode==='village'); const sx=n.wx-ADV.camX;
    const on=vis && sx>-80 && sx<W+80;
    n.s.setVisible(on); n.t.setVisible(on);
    if(on){ n.s.x=sx; n.s.y=gy; n.s.setDepth(gy-2); n.t.x=sx; n.t.y=gy-HERO_PX*1.02; n.t.setDepth(gy-2); }
  }
  // interaction hint + purse chip
  const it=advNearest();
  if(ADV._hint) ADV._hint.textContent = it ? ('E — '+(it.kind==='npc'?('TALK · '+it.n.nm)
    : it.kind==='well'?'THE WELL' : it.kind==='exit'?'THE OLD ROAD' : it.kind==='back'?'BACK TO KARRIDGE'
    : 'ENTER THE PIT OF KARRIDGE')) : '';
  if(ADV._chip) ADV._chip.textContent = 'GOLD '+ADV.gold+'  ·  POTIONS '+ADV.potions+' (E in the pit)'
    + (ADV.relics.length? '  ·  '+ADV.relics.join(' · ') : '');
}
// --- BONE-DRAGON GAS made VISIBLE again (Hiro bug 2026-07-09: "breath is invisible"): the pit-era
// circle telegraph was purged with the old VFX; the sim still lays + ticks the gas zone. Draw it as
// a soft layered sheol cloud (render-only) after every sim tick. ---
{ const _updZones=updZones;
  updZones=function(dt){ _updZones(dt);
    const g=scene && scene.zoneGfx; if(!g) return; g.clear();

      g.fillStyle(0x59d08a, 0.10+0.05*pu); g.fillEllipse(z.x, z.y, (z.r||90)*2.05, (z.r||90)*0.62);
      g.fillStyle(0x7fe0a0, 0.10);         g.fillEllipse(z.x, z.y-8, (z.r||90)*1.35, (z.r||90)*0.4);
      g.fillStyle(0xb0f0c0, 0.10+0.06*pu); g.fillEllipse(z.x+(z.r||90)*0.3*Math.sin(S.time*1.7), z.y-14, (z.r||90)*0.5, (z.r||90)*0.2);
    }
  };
}

// ---------------------------------------------------------------------------
// TOUCH CONTROLS (Hiro asked 3x) — virtual stick + DC verb cluster, routed into the SAME globals the
// keyboard uses so there is ZERO new combat path: the stick writes stick.{dx,dy,on} (read each frame in
// movement) and the buttons call the global verbs (doSlash/doHeavy+heavyRelease/doParry/doRoll). SUMMON
// mirrors the Q hold-to-channel / release-to-summon feel. Pointer Events (unified mouse+touch+pen).
// ---------------------------------------------------------------------------
(function(){
  const touch=document.getElementById('touch'); if(!touch) return;
  const isCoarse = ('ontouchstart' in window) || (navigator.maxTouchPoints>0)
                || (window.matchMedia && matchMedia('(pointer:coarse)').matches);
  if(isCoarse || /[?&]touch=1/.test(location.search)){
    touch.classList.add('on');
    const legend=document.getElementById('verbs'); if(legend) legend.style.display='none';  // keyboard hint overlaps the cluster
  }
  // --- virtual stick: nub follows the finger within a radius; writes the analog vector the sim reads ---
  const base=document.getElementById('stickBase'), nub=document.getElementById('stickNub'), R=46;
  let sid=null;
  const setNub=(x,y)=>{ nub.style.transform='translate('+x+'px,'+y+'px)'; };
  function resetStick(){ if(typeof stick!=='undefined'){ stick.on=false; stick.dx=0; stick.dy=0; } setNub(0,0); sid=null; }
  function moveStick(cx,cy){ const r=base.getBoundingClientRect();
    let dx=cx-(r.left+r.width/2), dy=cy-(r.top+r.height/2); const m=Math.hypot(dx,dy)||1;
    const cl=Math.min(m,R); setNub(dx/m*cl, dy/m*cl);
    if(typeof stick!=='undefined'){ const mag=Math.min(1,m/R); stick.dx=dx/m*mag; stick.dy=dy/m*mag; stick.on=true; } }
  base.addEventListener('pointerdown',e=>{ e.preventDefault(); sid=e.pointerId; try{base.setPointerCapture(e.pointerId);}catch(_){}; moveStick(e.clientX,e.clientY); });
  base.addEventListener('pointermove',e=>{ if(e.pointerId!==sid)return; e.preventDefault(); moveStick(e.clientX,e.clientY); });
  const stickEnd=e=>{ if(e.pointerId!==sid)return; resetStick(); };
  base.addEventListener('pointerup',stickEnd); base.addEventListener('pointercancel',stickEnd);
  // --- verb buttons: down/up so SUMMON can hold-to-channel, release-to-summon (Q parity) ---
  function wire(id,onDown,onUp){ const el=document.getElementById(id); if(!el) return;
    el.addEventListener('pointerdown',e=>{ e.preventDefault(); el.classList.add('act'); onDown&&onDown(); });
    const up=e=>{ e&&e.preventDefault&&e.preventDefault(); el.classList.remove('act'); onUp&&onUp(); };
    el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up); el.addEventListener('pointerleave',e=>{ el.classList.remove('act'); }); }
  const G=fn=>(typeof window[fn]==='function');   // verbs are top-level fn declarations -> window.<fn>
  wire('bHex',    ()=>{ if(typeof P!=='undefined'&&P.evoPick){ if(G('pickEvo'))pickEvo(0); return; } if(G('doSlash'))doSlash(); });
  wire('bSummon', ()=>{ if(typeof P!=='undefined'&&P.evoPick){ if(G('pickEvo'))pickEvo(1); return; } if(typeof P!=='undefined'&&!P.channel&&G('doHeavy'))doHeavy(); },
                  ()=>{ if(G('heavyRelease'))heavyRelease(); });
  wire('bDodge',  ()=>{ if(G('doRoll'))doRoll(); });
  wire('bWard',   ()=>{ if(G('doParry'))doParry(); });
})();
</script>
